<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0, user-scalable=no">
  <title>POC 4 — Combat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d1a;
      color: #e8d5b0;
      font-family: Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      gap: 10px;
      max-width: 390px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    header h2 { font-size: 13px; opacity: 0.55; letter-spacing: 2px; text-transform: uppercase; font-family: monospace; }
    header a   { color: #c8941e; text-decoration: none; font-size: 12px; opacity: 0.7; font-family: monospace; }

    /* HP bars */
    .combatants {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .combatant {
      flex: 1;
      padding: 10px 12px;
      background: #14142a;
      border: 1px solid #2a1f15;
      border-radius: 10px;
    }
    .combatant.player { border-color: #3a5a3a; }
    .combatant.enemy  { border-color: #5a2a2a; }
    .combatant-icon { font-size: 1.6em; margin-bottom: 4px; }
    .combatant-name { font-size: 11px; opacity: 0.5; font-family: monospace; letter-spacing: 0.08em; text-transform: uppercase; }
    .hp-label { font-size: 12px; margin: 6px 0 3px; font-family: monospace; }
    .hp-label span { color: #c8941e; }
    .hp-bar-bg {
      height: 8px;
      background: #0d0d1a;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #2a1f15;
    }
    .hp-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .player .hp-bar-fill  { background: #3a9a3a; }
    .enemy  .hp-bar-fill  { background: #9a3a3a; }
    .status-tag {
      display: inline-block;
      font-size: 10px;
      margin-top: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      min-height: 18px;
    }
    .status-tag.dodge  { background: #1a3a1a; color: #80e080; }
    .status-tag.tricked{ background: #1a1a3a; color: #8080e0; }

    /* Dice tray */
    .dice-section { width: 100%; }
    .section-label {
      font-size: 10px;
      opacity: 0.4;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: monospace;
      margin-bottom: 6px;
    }
    .dice-tray {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      background: #14142a;
      border: 1px solid #2a1f15;
      border-radius: 10px;
      justify-content: center;
    }
    .die-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .die-lbl  { font-size: 9px; opacity: 0.45; font-family: monospace; }
    .die {
      width: 56px; height: 56px;
      border-radius: 10px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      position: relative;
    }
    .die::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 10px;
      box-shadow: inset 0 -3px 5px rgba(0,0,0,0.4), inset 0 3px 5px rgba(255,255,255,0.1);
      pointer-events: none;
    }
    .die.red    { background: #8b1a1a; }
    .die.blue   { background: #1a3a8b; }
    .die.green  { background: #1a7a2a; }
    .die.yellow { background: #8b7200; }
    .pip-slot { display: flex; align-items: center; justify-content: center; }
    .pip-dot  { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.88); transition: opacity 0.08s; }
    .pip-dot.off { opacity: 0; }
    @keyframes shake {
      0%{transform:rotate(0)scale(1)}15%{transform:rotate(-18deg)scale(1.12)}
      35%{transform:rotate(13deg)scale(0.92)}55%{transform:rotate(-9deg)scale(1.07)}
      75%{transform:rotate(5deg)scale(0.97)}100%{transform:rotate(0)scale(1)}
    }
    .die.rolling { animation: shake 0.5s ease; }

    /* Pip totals row */
    .pip-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .pip-chip {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      font-family: monospace;
      min-width: 52px;
      text-align: center;
    }
    .pip-chip.red    { background: #3a0a0a; color: #ff9090; border: 1px solid #5a1a1a; }
    .pip-chip.blue   { background: #0a1040; color: #90aaff; border: 1px solid #1a2a60; }
    .pip-chip.green  { background: #0a2a0a; color: #90ff90; border: 1px solid #1a5a1a; }
    .pip-chip.yellow { background: #2a2000; color: #ffe060; border: 1px solid #4a3a00; }

    /* Buttons */
    .btn-roll {
      padding: 10px 32px;
      background: #c8941e;
      color: #0d0d1a;
      border: none;
      border-radius: 8px;
      font-size: 0.9em;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.12s;
      font-family: Georgia, serif;
      align-self: center;
    }
    .btn-roll:hover:not(:disabled)  { background: #e0a830; }
    .btn-roll:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Action list */
    .actions { display: flex; flex-direction: column; gap: 7px; width: 100%; }
    .act-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #14142a;
      border: 1px solid #2a1f15;
      border-radius: 8px;
      color: #e8d5b0;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
      text-align: left;
      gap: 8px;
    }
    .act-btn:hover:not(:disabled) { background: #1c1c36; border-color: #5a4835; }
    .act-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .act-btn .act-name { font-size: 0.88em; font-weight: bold; }
    .act-btn .act-desc { font-size: 0.7em; color: #6b5843; margin-top: 2px; }
    .act-btn .act-left { flex: 1; }
    .cost-pills { display: flex; gap: 3px; flex-shrink: 0; }
    .cpill {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      font-family: monospace;
    }
    .cpill.red    { background: #5a1010; color: #ffaaaa; }
    .cpill.blue   { background: #10205a; color: #aac0ff; }
    .cpill.green  { background: #104a10; color: #aaeeaa; }
    .cpill.yellow { background: #3a3000; color: #ffee80; }

    /* Battle log */
    #log {
      width: 100%;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.55;
      max-height: 110px;
      overflow-y: auto;
      padding: 8px 10px;
      background: #0a0a18;
      border: 1px solid #1a1528;
      border-radius: 8px;
    }
    .log-line { color: #7a6a55; }
    .log-line.hit    { color: #e07060; }
    .log-line.heal   { color: #70c070; }
    .log-line.info   { color: #c8b090; }
    .log-line.warn   { color: #e8c050; }
    .log-line.system { color: #8888cc; }

    /* Game over overlay */
    #gameover {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(13,13,26,0.92);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }
    #gameover.show { display: flex; }
    #gameover h2 { font-size: 1.8em; }
    #gameover p  { font-size: 0.9em; color: #8b7355; }
    #gameover .btn-restart {
      padding: 12px 28px;
      background: #c8941e;
      color: #0d0d1a;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      font-family: Georgia, serif;
    }
  </style>
</head>
<body>
  <header>
    <a href="../../">← Back</a>
    <h2>POC 4 — Combat</h2>
    <span></span>
  </header>

  <!-- Combatants -->
  <div class="combatants">
    <div class="combatant player">
      <div class="combatant-icon">🐭</div>
      <div class="combatant-name">Pip</div>
      <div class="hp-label">HP <span id="php">15</span> / 15</div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="php-bar" style="width:100%"></div></div>
      <div id="player-status" class="status-tag"></div>
    </div>
    <div class="combatant enemy">
      <div class="combatant-icon">🐀</div>
      <div class="combatant-name">Dungeon Rat</div>
      <div class="hp-label">HP <span id="ehp">12</span> / 12</div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="ehp-bar" style="width:100%"></div></div>
      <div id="enemy-status" class="status-tag"></div>
    </div>
  </div>

  <!-- Dice -->
  <div class="dice-section">
    <div class="section-label">Dice Pool</div>
    <div class="dice-tray">
      <div class="die-wrap"><div class="die red"    id="die-red"   ></div><div class="die-lbl">🔴 STR</div></div>
      <div class="die-wrap"><div class="die blue"   id="die-blue"  ></div><div class="die-lbl">🔵 INT</div></div>
      <div class="die-wrap"><div class="die green"  id="die-green" ></div><div class="die-lbl">🟢 AGI</div></div>
      <div class="die-wrap"><div class="die yellow" id="die-yellow"></div><div class="die-lbl">🟡 LCK</div></div>
    </div>
  </div>

  <div class="pip-row">
    <div class="pip-chip red"   >🔴 <span id="pips-red">—</span></div>
    <div class="pip-chip blue"  >🔵 <span id="pips-blue">—</span></div>
    <div class="pip-chip green" >🟢 <span id="pips-green">—</span></div>
    <div class="pip-chip yellow">🟡 <span id="pips-yellow">—</span></div>
  </div>

  <button class="btn-roll" id="roll-btn">⚄ Roll Dice</button>

  <!-- Actions -->
  <div class="section-label" style="align-self:flex-start">Actions</div>
  <div class="actions">
    <button class="act-btn" id="act-strike" disabled
        data-red="2" data-blue="0" data-green="0" data-yellow="0">
      <div class="act-left">
        <div class="act-name">⚔️ Strike</div>
        <div class="act-desc">Deal 3 damage to the enemy</div>
      </div>
      <div class="cost-pills"><span class="cpill red">2🔴</span></div>
    </button>
    <button class="act-btn" id="act-heavy" disabled
        data-red="4" data-blue="0" data-green="0" data-yellow="0">
      <div class="act-left">
        <div class="act-name">🪓 Heavy Strike</div>
        <div class="act-desc">Deal 7 damage — high cost, big hit</div>
      </div>
      <div class="cost-pills"><span class="cpill red">4🔴</span></div>
    </button>
    <button class="act-btn" id="act-dodge" disabled
        data-red="0" data-blue="0" data-green="2" data-yellow="0">
      <div class="act-left">
        <div class="act-name">💨 Dodge</div>
        <div class="act-desc">Reduce next incoming hit by 3</div>
      </div>
      <div class="cost-pills"><span class="cpill green">2🟢</span></div>
    </button>
    <button class="act-btn" id="act-trick" disabled
        data-red="0" data-blue="3" data-green="0" data-yellow="0">
      <div class="act-left">
        <div class="act-name">🧠 Trick</div>
        <div class="act-desc">Confuse enemy — they skip their attack</div>
      </div>
      <div class="cost-pills"><span class="cpill blue">3🔵</span></div>
    </button>
  </div>

  <div id="log"></div>

  <!-- Game Over -->
  <div id="gameover">
    <h2 id="gameover-title"></h2>
    <p id="gameover-msg"></p>
    <button class="btn-restart" id="restart-btn">Play Again</button>
  </div>

  <script>
    // --- Pip slot layouts (3×3 grid, index 0-8) ---
    const PIP_SLOTS = { 1:[4], 2:[2,6], 3:[2,4,6], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
    const COLORS = ['red','blue','green','yellow'];

    // --- Game state ---
    const MAX_PHP = 15, MAX_EHP = 12;
    let state = {
      php: MAX_PHP, ehp: MAX_EHP,
      pips: { red:0, blue:0, green:0, yellow:0 },
      rolled: false,
      rolling: false,
      playerDodge: false,   // reduces next enemy hit by 3
      enemyTricked: false,  // enemy skips next attack
      over: false,
    };

    // --- Die face helpers ---
    function buildDie(el) {
      el.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const slot = document.createElement('div');
        slot.className = 'pip-slot';
        const dot = document.createElement('div');
        dot.className = 'pip-dot off';
        dot.dataset.idx = i;
        slot.appendChild(dot);
        el.appendChild(slot);
      }
    }
    function setDie(el, val) {
      const active = PIP_SLOTS[val] || [];
      el.querySelectorAll('.pip-dot').forEach(d =>
        d.classList.toggle('off', !active.includes(+d.dataset.idx))
      );
    }
    COLORS.forEach(c => buildDie(document.getElementById(`die-${c}`)));

    // --- Render helpers ---
    function updateHP() {
      const php = Math.max(0, state.php);
      const ehp = Math.max(0, state.ehp);
      document.getElementById('php').textContent     = php;
      document.getElementById('ehp').textContent     = ehp;
      document.getElementById('php-bar').style.width = (php / MAX_PHP * 100) + '%';
      document.getElementById('ehp-bar').style.width = (ehp / MAX_EHP * 100) + '%';
    }
    function updatePips() {
      COLORS.forEach(c => {
        document.getElementById(`pips-${c}`).textContent = state.rolled ? state.pips[c] : '—';
      });
    }
    function updateActions() {
      document.querySelectorAll('.act-btn').forEach(btn => {
        if (!state.rolled || state.over) { btn.disabled = true; return; }
        btn.disabled = !COLORS.every(c => state.pips[c] >= (+btn.dataset[c] || 0));
      });
    }
    function updateStatuses() {
      const ps = document.getElementById('player-status');
      const es = document.getElementById('enemy-status');
      ps.textContent = state.playerDodge  ? '🛡 Dodging'  : '';
      ps.className   = 'status-tag' + (state.playerDodge  ? ' dodge'   : '');
      es.textContent = state.enemyTricked ? '😵 Tricked'  : '';
      es.className   = 'status-tag' + (state.enemyTricked ? ' tricked' : '');
    }

    function addLog(msg, cls = '') {
      const log  = document.getElementById('log');
      const line = document.createElement('div');
      line.className = 'log-line ' + cls;
      line.textContent = msg;
      log.appendChild(line);
      while (log.children.length > 12) log.removeChild(log.firstChild);
      log.scrollTop = log.scrollHeight;
    }

    // --- Roll ---
    document.getElementById('roll-btn').addEventListener('click', () => {
      if (state.rolling || state.over) return;
      state.rolling = true;
      state.rolled  = false;
      document.getElementById('roll-btn').disabled = true;
      updateActions();

      const finals = COLORS.map(() => 1 + Math.floor(Math.random() * 6));
      COLORS.forEach(c => document.getElementById(`die-${c}`).classList.add('rolling'));

      let ticks = 0;
      const scram = setInterval(() => {
        COLORS.forEach(c => setDie(document.getElementById(`die-${c}`), 1 + Math.floor(Math.random() * 6)));
        if (++ticks > 10) {
          clearInterval(scram);
          COLORS.forEach((c, i) => {
            const el = document.getElementById(`die-${c}`);
            el.classList.remove('rolling');
            setDie(el, finals[i]);
            state.pips[c] = finals[i];
          });
          state.rolled  = true;
          state.rolling = false;
          document.getElementById('roll-btn').disabled = false;
          updatePips();
          updateActions();
          addLog(`Rolled: 🔴${state.pips.red} 🔵${state.pips.blue} 🟢${state.pips.green} 🟡${state.pips.yellow}`, 'info');
        }
      }, 50);
    });

    // --- Actions ---
    function spendAction(btn) {
      if (btn.disabled || state.over) return;
      const costs = { red: +btn.dataset.red, blue: +btn.dataset.blue, green: +btn.dataset.green, yellow: +btn.dataset.yellow };
      if (!COLORS.every(c => state.pips[c] >= costs[c])) { addLog('Not enough pips!', 'warn'); return; }

      COLORS.forEach(c => { state.pips[c] -= costs[c]; });
      updatePips();
      updateActions();

      const id = btn.id;
      if (id === 'act-strike') {
        const dmg = 3;
        state.ehp -= dmg;
        addLog(`Pip strikes! Enemy takes ${dmg} damage.`, 'hit');
      } else if (id === 'act-heavy') {
        const dmg = 7;
        state.ehp -= dmg;
        addLog(`Pip SMASHES! Enemy takes ${dmg} damage!`, 'hit');
      } else if (id === 'act-dodge') {
        state.playerDodge = true;
        addLog(`Pip dodges — next hit reduced by 3.`, 'heal');
      } else if (id === 'act-trick') {
        state.enemyTricked = true;
        addLog(`Pip tricks the rat — it's confused!`, 'system');
      }

      updateHP();
      updateStatuses();
      checkOver();

      if (!state.over) enemyTurn();
    }

    document.querySelectorAll('.act-btn').forEach(btn =>
      btn.addEventListener('click', () => spendAction(btn))
    );

    function enemyTurn() {
      if (state.enemyTricked) {
        addLog(`The rat stumbles and misses its turn.`, 'system');
        state.enemyTricked = false;
      } else {
        let dmg = 2;
        if (state.playerDodge) {
          dmg = Math.max(0, dmg - 3);
          addLog(`The rat attacks but Pip dodges! Only ${dmg} damage.`, dmg > 0 ? 'hit' : 'heal');
        } else {
          addLog(`The rat bites Pip for ${dmg} damage!`, 'hit');
        }
        state.php -= dmg;
        state.playerDodge = false;
      }

      updateHP();
      updateStatuses();
      // Reset for next round
      state.rolled = false;
      COLORS.forEach(c => { state.pips[c] = 0; });
      updatePips();
      updateActions();
      checkOver();
      if (!state.over) addLog('— New round — Roll dice.', 'system');
    }

    function checkOver() {
      if (state.ehp <= 0) {
        state.over = true;
        document.getElementById('gameover-title').textContent = '⚔️ Victory!';
        document.getElementById('gameover-msg').textContent   = 'Pip defeated the Dungeon Rat!';
        document.getElementById('gameover').classList.add('show');
        updateActions();
      } else if (state.php <= 0) {
        state.over = true;
        document.getElementById('gameover-title').textContent = '💀 Pip fell…';
        document.getElementById('gameover-msg').textContent   = 'The dungeon claims another explorer.';
        document.getElementById('gameover').classList.add('show');
        updateActions();
      }
    }

    document.getElementById('restart-btn').addEventListener('click', () => {
      state = {
        php: MAX_PHP, ehp: MAX_EHP,
        pips: { red:0, blue:0, green:0, yellow:0 },
        rolled: false, rolling: false,
        playerDodge: false, enemyTricked: false, over: false,
      };
      COLORS.forEach(c => { buildDie(document.getElementById(`die-${c}`)); });
      document.getElementById('log').innerHTML     = '';
      document.getElementById('gameover').classList.remove('show');
      document.getElementById('roll-btn').disabled = false;
      updateHP();
      updatePips();
      updateStatuses();
      updateActions();
      addLog('A new battle begins. Roll to start!', 'system');
    });

    // --- Init ---
    updateHP();
    updatePips();
    updateStatuses();
    updateActions();
    addLog('Pip encounters a Dungeon Rat! Roll to start.', 'system');
  </script>
</body>
</html>
