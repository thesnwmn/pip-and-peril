<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0, user-scalable=no">
  <title>POC 5 — Room Selection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d1a;
      color: #e8d5b0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      gap: 10px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 360px;
    }
    header h2 { font-size: 13px; opacity: 0.55; letter-spacing: 2px; text-transform: uppercase; }
    header a   { color: #c8941e; text-decoration: none; font-size: 12px; opacity: 0.7; }

    canvas { display: block; border: 1px solid #181830; border-radius: 4px; }

    /* Direction compass */
    .compass {
      display: grid;
      grid-template-columns: 50px 50px 50px;
      grid-template-rows: 50px 50px 50px;
      gap: 4px;
    }
    .dir-btn {
      width: 50px; height: 50px;
      background: #14142a;
      border: 1px solid #2a2a50;
      border-radius: 8px;
      color: #e8d5b0;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s, border-color 0.1s;
    }
    .dir-btn:not(:disabled):hover { background: #1e1e3e; border-color: #c8941e; }
    .dir-btn:disabled { opacity: 0.12; cursor: default; }
    .dir-center {
      width: 50px; height: 50px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #3a3a60;
    }

    /* Room choice cards */
    .choice-row {
      display: flex;
      gap: 8px;
      width: 360px;
    }
    .choice-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 8px 4px 6px;
      border-radius: 10px;
      border: 2px solid;
      background: transparent;
      cursor: pointer;
      transition: filter 0.1s, transform 0.1s;
      font-family: monospace;
    }
    .choice-card:hover  { filter: brightness(1.3); transform: translateY(-2px); }
    .choice-card:active { transform: translateY(0); }
    .choice-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: bold; }

    /* Hint bar */
    #hint {
      font-size: 11px;
      color: #4a3a28;
      min-height: 16px;
      text-align: center;
      width: 360px;
    }

    /* Event log */
    #log {
      width: 360px;
      background: #0a0a16;
      border: 1px solid #181830;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-height: 62px;
    }
    .log-entry  { font-size: 11px; line-height: 1.45; }
    .log-normal { color: #6b5a45; }
    .log-system { color: #c8941e; }
    .log-enemy  { color: #ff8070; }
    .log-boss   { color: #ff4040; font-weight: bold; }
    .log-shop   { color: #f0c060; }
    .log-npc    { color: #70b8f0; }
    .log-item   { color: #60d080; }
    .log-chest  { color: #f0a060; }

    /* Bottom controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 360px;
    }
    #step-info { font-size: 12px; color: #6b5a45; }
    #step-info span { color: #c8941e; }
    .btn {
      padding: 8px 18px;
      background: #c8941e; color: #0d0d1a;
      border: none; border-radius: 8px;
      font-size: 12px; font-weight: bold;
      cursor: pointer; font-family: monospace;
      letter-spacing: 0.05em;
    }
    .btn:hover { background: #e0a830; }
  </style>
</head>
<body>
  <header>
    <a href="../../">← Back</a>
    <h2>POC 5 — Room Selection</h2>
    <span></span>
  </header>

  <canvas id="c"></canvas>
  <div id="hint"></div>
  <div id="panel"></div>
  <div id="log"></div>
  <div class="controls">
    <div id="step-info">Steps: <span id="steps">0</span></div>
    <button class="btn" id="new-btn">New Dungeon</button>
  </div>

  <script>
    // ── Direction constants ──────────────────────────────────────────────
    const N = 1, E = 2, S = 4, W = 8;
    const DIR_LIST  = [N, E, S, W];
    const OPP       = { [N]:S, [S]:N, [E]:W, [W]:E };
    const DDELTA    = { [N]:[0,-1], [E]:[1,0], [S]:[0,1], [W]:[-1,0] };
    const DARROW    = { [N]:'↑', [E]:'→', [S]:'↓', [W]:'←' };

    // ── Room types ───────────────────────────────────────────────────────
    const RT = { START:0, CORRIDOR:1, ENEMY:2, SHOP:3, NPC:4, ITEM:5, CHEST:6, BOSS:7 };

    const RDEF = {
      [RT.START]:    { label:'Start',    icon:'▼', wall:'#060e06', bg:'#0a1a0a', text:'#90e090', border:'#60c080', lc:'system'  },
      [RT.CORRIDOR]: { label:'Corridor', icon:'·', wall:'#090e14', bg:'#0e1620', text:'#8899aa', border:'#445566', lc:'normal'  },
      [RT.ENEMY]:    { label:'Enemy',    icon:'⚔', wall:'#120404', bg:'#200808', text:'#ff8070', border:'#c0392b', lc:'enemy'   },
      [RT.SHOP]:     { label:'Shop',     icon:'⚖', wall:'#0e0a00', bg:'#1c1400', text:'#f0c060', border:'#c8941e', lc:'shop'    },
      [RT.NPC]:      { label:'NPC',      icon:'◎', wall:'#040a10', bg:'#081420', text:'#70b8f0', border:'#2980b9', lc:'npc'     },
      [RT.ITEM]:     { label:'Item',     icon:'✦', wall:'#040a04', bg:'#081408', text:'#60d080', border:'#27ae60', lc:'item'    },
      [RT.CHEST]:    { label:'Chest',    icon:'⊞', wall:'#0e0800', bg:'#1c1000', text:'#f0a060', border:'#e67e22', lc:'chest'   },
      [RT.BOSS]:     { label:'Boss',     icon:'☠', wall:'#0b0000', bg:'#160000', text:'#ff4040', border:'#8e1010', lc:'boss'    },
    };

    // ── All valid exit bitmask configurations ────────────────────────────
    const ALL_EXITS = [
      // Dead ends
      N, E, S, W,
      // Straight corridors
      N|S, E|W,
      // Corners
      N|E, N|W, S|E, S|W,
      // T-junctions
      N|E|S, N|W|S, E|S|W, N|E|W,
      // Crossroads
      N|E|S|W,
    ];

    // ── Room pools by depth ──────────────────────────────────────────────
    const POOLS = [
      [RT.CORRIDOR,RT.CORRIDOR,RT.ENEMY,RT.SHOP,RT.NPC,RT.ITEM,RT.CHEST],
      [RT.CORRIDOR,RT.ENEMY,RT.ENEMY,RT.SHOP,RT.CHEST,RT.NPC,RT.ITEM],
      [RT.ENEMY,RT.ENEMY,RT.ENEMY,RT.CHEST,RT.ITEM,RT.SHOP,RT.BOSS],
    ];
    function poolFor(d) { return d <= 2 ? POOLS[0] : d <= 4 ? POOLS[1] : POOLS[2]; }

    // ── Flavour text ──────────────────────────────────────────────────────
    const MSGS = {
      [RT.CORRIDOR]: ['A quiet passage — nothing stirs.','Dusty corridors, cobwebs and silence.','The torchlight wavers. No danger lurks.'],
      [RT.ENEMY]:    ['A dungeon rat leaps from the shadows!','An enemy bars your way!','Something snarls in the dark.','Claws scrape on stone.'],
      [RT.SHOP]:     ['A merchant eyes your coin pouch.','Strange wares gleam in the torchlight.','The shopkeeper nods warily.'],
      [RT.NPC]:      ['A wounded adventurer slumps against the wall.','A stranger whispers a warning.','A robed figure stares at you.'],
      [RT.ITEM]:     ['Something glints in the rubble.','A discarded tool — still useful.','Left behind by a previous delver.'],
      [RT.CHEST]:    ['A locked chest. Worth the risk?','Gold light spills from the lid.','Heavy iron lock, weak hinges.'],
      [RT.BOSS]:     ['THE FLOOR SHAKES. Something ancient stirs.','A BOSS blocks the way. No retreat.'],
    };
    const SURPRISE = {
      [RT.ENEMY]: ['Wait — it bolts on sight.','The enemy was dead already.'],
      [RT.SHOP]:  ['"Sold out," the merchant mutters.','Bare shelves. Someone beat you here.'],
      [RT.CHEST]: ['Empty. Someone got here first.','A decoy — just rocks inside.'],
      [RT.NPC]:   ['They say nothing. Just point deeper.'],
      [RT.ITEM]:  ['Broken beyond use.','Cursed. You leave it well alone.'],
    };

    // ── Grid & canvas setup ───────────────────────────────────────────────
    const MSIZE = 11;
    const MID   = 5;
    const TS    = 30;   // tile size
    const TGAP  = 2;    // gap between tiles
    const TPAD  = 9;    // canvas padding
    const CW    = MSIZE * TS + (MSIZE - 1) * TGAP + TPAD * 2;

    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    canvas.width = canvas.height = CW;

    // ── State ─────────────────────────────────────────────────────────────
    let grid, px, py, stepCount, uiState, pendingDir, offerings, eventLog;
    // uiState: 'pick-dir' | 'pick-room'

    // ── Utility ───────────────────────────────────────────────────────────
    const pick    = a => a[0|Math.random()*a.length];
    const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b; };
    const inBounds = (x,y) => x>=0 && x<MSIZE && y>=0 && y<MSIZE;
    const getCell  = (x,y) => (grid[y]??[])[x]??null;
    const setCell  = (x,y,c) => { if(grid[y]) grid[y][x]=c; };
    const txPos    = c => TPAD + c*(TS+TGAP);
    const tyPos    = r => TPAD + r*(TS+TGAP);
    const dist     = (x,y) => Math.max(Math.abs(x-MID), Math.abs(y-MID));

    // ── Tile renderer (shared for map + mini previews) ────────────────────
    function drawTileCtx(c, type, exits, x, y, s, opts = {}) {
      const def = RDEF[type];
      const wt  = Math.round(s * 0.22);  // wall thickness
      const cw  = Math.round(s * 0.37);  // corridor opening width
      const co  = Math.round((s - cw) / 2); // corridor offset

      // Wall fill
      c.fillStyle = opts.dim ? '#0b0b1a' : def.wall;
      c.fillRect(x, y, s, s);

      // Floor area
      c.fillStyle = opts.dim ? '#111126' : def.bg;
      c.fillRect(x+wt, y+wt, s-wt*2, s-wt*2);

      // Exit corridors (punch through walls)
      c.fillStyle = opts.dim ? '#111126' : def.bg;
      if (exits & N) c.fillRect(x+co,   y,      cw, wt);
      if (exits & S) c.fillRect(x+co,   y+s-wt, cw, wt);
      if (exits & E) c.fillRect(x+s-wt, y+co,   wt, cw);
      if (exits & W) c.fillRect(x,      y+co,   wt, cw);

      // Room icon
      c.fillStyle    = opts.dim ? '#2a2a50' : def.text;
      c.font         = `${Math.round(s * 0.33)}px serif`;
      c.textAlign    = 'center';
      c.textBaseline = 'middle';
      c.fillText(def.icon, x + s/2, y + s/2 + 1);

      // Typed border (for choice cards on map)
      if (opts.border) {
        c.strokeStyle = def.border;
        c.lineWidth   = 1.5;
        c.strokeRect(x + 1, y + 1, s - 2, s - 2);
      }

      // Current position — draw Pip
      if (opts.current) {
        const cx = x + s/2;
        const cy = y + s/2;
        const r  = Math.max(4, s * 0.26);

        c.fillStyle = '#f5e6c8';
        c.beginPath(); c.arc(cx, cy+1, r, 0, Math.PI*2); c.fill();

        const er = r * 0.4;
        c.fillStyle = '#e0c8a0';
        c.beginPath(); c.arc(cx-r*.55, cy-r*.7, er, 0, Math.PI*2); c.fill();
        c.beginPath(); c.arc(cx+r*.55, cy-r*.7, er, 0, Math.PI*2); c.fill();

        c.fillStyle = '#3d2b1f';
        c.beginPath(); c.arc(cx+r*.28, cy-r*.05, r*.16, 0, Math.PI*2); c.fill();

        c.fillStyle = '#c87060';
        c.beginPath(); c.arc(cx+r*.48, cy+r*.3, r*.13, 0, Math.PI*2); c.fill();
      }

      // Highlight for current tile (golden border)
      if (opts.current) {
        c.strokeStyle = '#c8941e';
        c.lineWidth   = 1.5;
        c.strokeRect(x + 1, y + 1, s - 2, s - 2);
      }
    }

    // ── Main canvas render ────────────────────────────────────────────────
    function render() {
      ctx.fillStyle = '#0d0d1a';
      ctx.fillRect(0, 0, CW, CW);

      for (let r = 0; r < MSIZE; r++) {
        for (let c = 0; c < MSIZE; c++) {
          const cell = getCell(c, r);
          const x = txPos(c), y = tyPos(r);

          if (!cell) {
            // Unknown — dark placeholder
            ctx.fillStyle = '#0c0c1c';
            ctx.fillRect(x, y, TS, TS);
            ctx.fillStyle = '#1a1a36';
            ctx.font         = `${Math.floor(TS*.28)}px monospace`;
            ctx.textAlign    = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', x+TS/2, y+TS/2);
          } else {
            const isCurrent = c === px && r === py;
            drawTileCtx(ctx, cell.type, cell.exits, x, y, TS, {
              current: isCurrent,
              dim:     !isCurrent,
              border:  !isCurrent,
            });
          }
        }
      }

      renderPanel();
    }

    // ── Constraint-aware exit config list ─────────────────────────────────
    function validExitConfigs(nx, ny, entryDir) {
      let forced   = entryDir;
      let forbidden = 0;

      for (const d of DIR_LIST) {
        const [dx, dy] = DDELTA[d];
        const ax = nx+dx, ay = ny+dy;
        if (!inBounds(ax, ay)) { forbidden |= d; continue; }
        const adj = getCell(ax, ay);
        if (!adj) continue;
        if (adj.exits & OPP[d]) forced    |= d;
        else                    forbidden |= d;
      }

      const valid = ALL_EXITS.filter(c => (c & forced)===forced && (c & forbidden)===0);
      // Ensure we have at least one option
      if (valid.length === 0) valid.push(forced);
      return valid;
    }

    // ── Generate 3 offerings ──────────────────────────────────────────────
    function generateOfferings(nx, ny, entryDir) {
      const d      = dist(nx, ny);
      const types  = shuffle([...new Set(poolFor(d))]).slice(0, 3);
      while (types.length < 3) types.push(pick(poolFor(d)));

      const cfgs   = shuffle(validExitConfigs(nx, ny, entryDir));
      while (cfgs.length < 3) cfgs.push(cfgs[cfgs.length-1]);

      return types.map((type, i) => ({ type, exits: cfgs[i] }));
    }

    // ── UI panel (direction picker or room choices) ───────────────────────
    function availableDirs() {
      const cell = getCell(px, py);
      if (!cell) return [];
      return DIR_LIST.filter(d => {
        if (!(cell.exits & d)) return false;
        const [dx, dy] = DDELTA[d];
        const nx = px+dx, ny = py+dy;
        if (!inBounds(nx, ny)) return false;
        const adj = getCell(nx, ny);
        return !adj || !!(adj.exits & OPP[d]);
      });
    }

    function renderPanel() {
      const panel = document.getElementById('panel');
      const hint  = document.getElementById('hint');
      panel.innerHTML = '';

      if (uiState === 'pick-dir') {
        const avail = availableDirs();
        hint.textContent = avail.length ? 'Choose a direction' : 'No exits — dead end';

        const compass = document.createElement('div');
        compass.className = 'compass';

        const slots = [
          null,  N,    null,
          W,     null, E,
          null,  S,    null,
        ];
        for (const d of slots) {
          if (d === null) {
            const gap = document.createElement('div');
            gap.className = 'dir-center';
            compass.appendChild(gap);
          } else {
            const btn = document.createElement('button');
            btn.className = 'dir-btn';
            btn.textContent = DARROW[d];
            if (!avail.includes(d)) btn.disabled = true;
            else btn.addEventListener('click', () => pickDirection(d));
            compass.appendChild(btn);
          }
        }
        panel.appendChild(compass);

      } else if (uiState === 'pick-room') {
        hint.textContent = 'Choose a room to place';
        const row = document.createElement('div');
        row.className = 'choice-row';

        offerings.forEach((o, i) => {
          const def  = RDEF[o.type];
          const card = document.createElement('button');
          card.className        = 'choice-card';
          card.style.borderColor = def.border;
          card.style.background  = def.bg;

          // Mini tile preview
          const mc   = document.createElement('canvas');
          mc.width = mc.height = 60;
          const mctx = mc.getContext('2d');
          mctx.fillStyle = '#0d0d1a';
          mctx.fillRect(0, 0, 60, 60);
          drawTileCtx(mctx, o.type, o.exits, 5, 5, 50, { border: true });
          card.appendChild(mc);

          const lbl = document.createElement('span');
          lbl.className = 'choice-label';
          lbl.style.color = def.text;
          lbl.textContent = def.label;
          card.appendChild(lbl);

          card.addEventListener('click', () => placeRoom(i));
          row.appendChild(card);
        });
        panel.appendChild(row);
      }
    }

    // ── Direction selected ────────────────────────────────────────────────
    function pickDirection(dir) {
      if (uiState !== 'pick-dir') return;
      const [dx, dy] = DDELTA[dir];
      const nx = px+dx, ny = py+dy;
      const existing = getCell(nx, ny);

      if (existing) {
        px = nx; py = ny; stepCount++;
        document.getElementById('steps').textContent = stepCount;
        addLog(`[Move] Back to ${RDEF[existing.type].label}.`, 'normal');
        render();
        return;
      }

      pendingDir = dir;
      offerings  = generateOfferings(nx, ny, OPP[dir]);
      uiState    = 'pick-room';
      render();
    }

    // ── Room chosen ───────────────────────────────────────────────────────
    function placeRoom(idx) {
      if (uiState !== 'pick-room' || pendingDir === null) return;
      const o = offerings[idx];
      const [dx, dy] = DDELTA[pendingDir];
      const nx = px+dx, ny = py+dy;

      setCell(nx, ny, { type: o.type, exits: o.exits });
      px = nx; py = ny; stepCount++;
      document.getElementById('steps').textContent = stepCount;

      logEncounter(o.type);

      pendingDir = null;
      offerings  = [];
      uiState    = 'pick-dir';
      render();
    }

    // ── Log ───────────────────────────────────────────────────────────────
    function addLog(msg, cls = 'normal') {
      eventLog.unshift({ msg, cls });
      if (eventLog.length > 5) eventLog.pop();
      document.getElementById('log').innerHTML =
        eventLog.map((e, i) =>
          `<div class="log-entry log-${e.cls}" style="opacity:${(1-i*.2).toFixed(2)}">${e.msg}</div>`
        ).join('');
    }

    function logEncounter(type) {
      if (type === RT.START) return;
      const def     = RDEF[type];
      const msgs    = MSGS[type] || ['You enter the room.'];
      let   msg     = pick(msgs);
      const sur     = SURPRISE[type];
      if (sur && Math.random() < 0.2) msg += ' ' + pick(sur);
      addLog(`[${def.label}] ${msg}`, def.lc);
    }

    // ── Keyboard ──────────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (uiState !== 'pick-dir') return;
      const map = {
        ArrowUp:'N', w:'N', W:'N',
        ArrowDown:'S', s:'S', S:'S',
        ArrowLeft:'W', a:'W', A:'W',
        ArrowRight:'E', d:'E', D:'E',
      };
      const k = map[e.key];
      if (!k) return;
      e.preventDefault();
      const d = { N, E, S, W }[k];
      if (availableDirs().includes(d)) pickDirection(d);
    });

    // ── Init ──────────────────────────────────────────────────────────────
    function init() {
      grid       = Array.from({ length: MSIZE }, () => Array(MSIZE).fill(null));
      px         = MID; py = MID;
      stepCount  = 0;
      uiState    = 'pick-dir';
      pendingDir = null;
      offerings  = [];
      eventLog   = [];

      setCell(MID, MID, { type: RT.START, exits: N|E|S|W });

      document.getElementById('steps').textContent = 0;
      document.getElementById('log').innerHTML = '';
      addLog('[Start] Pip descends into the dungeon...', 'system');
      render();
    }

    document.getElementById('new-btn').addEventListener('click', init);
    init();
  </script>
</body>
</html>
