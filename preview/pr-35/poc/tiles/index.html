<body>
  <header>
    <a href="../../">← Back</a>
    <h2>POC 6 — Tiles &amp; Props</h2>
    <span></span>
  </header>

  <p class="blurb">
    Exploring tile <b>variety</b>. A tile = <b>exit layout</b> × <b>interior archetype</b> ×
    <b>room type</b> × <b>props</b>. Doorway openings stay fixed so everything still snaps together;
    only the interior changes. See <b>docs/concept/tiles-and-props.md</b>.
  </p>

  <section id="sec-arch"></section>
  <section id="sec-types"></section>
  <section id="sec-props"></section>
  <section id="sec-use"></section>
  <section id="sec-random"></section>

  <script>
    // ── Directions (matches POC 5) ───────────────────────────────────────
    const N=1, E=2, S=4, W=8;
    const DIR_LIST = [N,E,S,W];
    const DDELTA = { [N]:[0,-1], [E]:[1,0], [S]:[0,1], [W]:[-1,0] };

    // ── Room types & palette (shared with POC 5) ─────────────────────────
    const RT = { START:0, CORRIDOR:1, ENEMY:2, SHOP:3, NPC:4, ITEM:5, CHEST:6, BOSS:7 };
    const RDEF = {
      [RT.START]:    { label:'Start',    icon:'▼', wall:'#0e130e', wl:'#141e14', floor:'#1e2e1e', fl:'#182618', text:'#90e090', border:'#60c080' },
      [RT.CORRIDOR]: { label:'Corridor', icon:'',  wall:'#161210', wl:'#1e1a16', floor:'#2e2620', fl:'#262018', text:'#9a8a7a', border:'#504840' },
      [RT.ENEMY]:    { label:'Enemy',    icon:'⚔', wall:'#180808', wl:'#220e0c', floor:'#2e1010', fl:'#261010', text:'#ff8070', border:'#c0392b' },
      [RT.SHOP]:     { label:'Shop',     icon:'⚖', wall:'#161000', wl:'#201800', floor:'#2c2010', fl:'#241a0c', text:'#f0c060', border:'#c8941e' },
      [RT.NPC]:      { label:'NPC',      icon:'◎', wall:'#0a0e18', wl:'#10162a', floor:'#121e30', fl:'#0e1826', text:'#70b8f0', border:'#2980b9' },
      [RT.ITEM]:     { label:'Item',     icon:'✦', wall:'#0a1008', wl:'#0e1810', floor:'#142014', fl:'#101c10', text:'#60d080', border:'#27ae60' },
      [RT.CHEST]:    { label:'Chest',    icon:'⊞', wall:'#140e00', wl:'#1c1400', floor:'#281808', fl:'#201408', text:'#f0a060', border:'#e67e22' },
      [RT.BOSS]:     { label:'Boss',     icon:'☠', wall:'#100000', wl:'#1a0000', floor:'#200000', fl:'#180000', text:'#ff4040', border:'#8e1010' },
    };

    // ── Seeded RNG (stable tiles between renders) ─────────────────────────
    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

    // Archetypes that own the centre (no scattered icon over them)
    const CENTRE_FEATURE = new Set(['well','pool']);

    // ── Tile renderer ─────────────────────────────────────────────────────
    // o = { type, exits, archetype, props:[{kind,anchor}], x, y, s, seed, current, border }
    function drawTile(c, o) {
      const def  = RDEF[o.type];
      const { x, y, s, exits } = o;
      const arch = o.archetype || 'chamber';
      const rnd  = mulberry32((o.seed ?? 1) * 2654435761 >>> 0);
      const wt = Math.round(s*0.191), cw = Math.round(s*0.382), co = Math.round((s-cw)/2);
      const fi = s - wt*2, cx = x+s/2, cy = y+s/2;
      const g  = { wt, cw, co, fi, cx, cy, def, rnd };

      // 1 ── Stone wall base + courses
      c.fillStyle = def.wall; c.fillRect(x, y, s, s);
      c.fillStyle = def.wl;
      const step = Math.max(5, Math.round(s*0.072));
      for (let ly = step; ly < s; ly += step) c.fillRect(x, y+ly, s, 1);

      // 2 ── Interior shape (the archetype layer)
      INTERIOR[arch](c, o, g);

      // 3 ── Doorway landings — punch the wall band so tiles always snap
      c.fillStyle = def.floor;
      if (exits&N) c.fillRect(x+co,   y,       cw, wt+1);
      if (exits&S) c.fillRect(x+co,   y+s-wt,  cw, wt+1);
      if (exits&E) c.fillRect(x+s-wt, y+co,    wt+1, cw);
      if (exits&W) c.fillRect(x,      y+co,    wt+1, cw);

      // door-frame lines (read the exit at a glance — from POC 5)
      c.strokeStyle = def.wl; c.lineWidth = 0.9;
      const lv=(lx,y1,y2)=>{ c.beginPath(); c.moveTo(lx+.5,y1); c.lineTo(lx+.5,y2); c.stroke(); };
      const lh=(ly,x1,x2)=>{ c.beginPath(); c.moveTo(x1,ly+.5); c.lineTo(x2,ly+.5); c.stroke(); };
      if (exits&N){ lv(x+co, y, y+wt); lv(x+co+cw, y, y+wt); }
      if (exits&S){ lv(x+co, y+s-wt, y+s); lv(x+co+cw, y+s-wt, y+s); }
      if (exits&E){ lh(y+co, x+s-wt, x+s); lh(y+co+cw, x+s-wt, x+s); }
      if (exits&W){ lh(y+co, x, x+wt); lh(y+co+cw, x, x+wt); }

      // 4 ── Props (light glows first so they sit under solid shapes)
      const props = o.props || [];
      props.filter(p=>GLOW.has(p.kind)).forEach(p => drawProp(c, p, o, g));
      props.filter(p=>!GLOW.has(p.kind)).forEach(p => drawProp(c, p, o, g));

      // 5 ── Room-type icon (suppressed where a centre feature lives)
      const hasCentre = CENTRE_FEATURE.has(arch) || props.some(p=>p.anchor==='center');
      if (def.icon && !hasCentre && !['passage','squeeze','bridge'].includes(arch)) {
        c.fillStyle = def.text;
        c.font = `bold ${Math.round(s*0.26)}px serif`;
        c.textAlign='center'; c.textBaseline='middle';
        c.fillText(def.icon, cx, cy+1);
      }

      // 6 ── Type border / current / shadow
      if (o.border) { c.strokeStyle = def.border; c.lineWidth = 2.5; c.strokeRect(x+1.5,y+1.5,s-3,s-3); }
      c.fillStyle = 'rgba(0,0,0,0.25)';
      c.fillRect(x, y+s-2, s, 2); c.fillRect(x+s-2, y, 2, s);
    }

    // ── Interior renderers ────────────────────────────────────────────────
    function flagstones(c, o, g) {
      const { x, y, s } = o, { wt, fi, def } = g;
      const fs = Math.floor(fi/3);
      c.strokeStyle = def.fl; c.lineWidth = 0.7;
      for (let r=0;r<3;r++) for (let cc=0;cc<3;cc++)
        c.strokeRect(x+wt+cc*fs+0.5, y+wt+r*fs+0.5, fs, fs);
    }
    // floor strips from centre out to each exit, given a width
    function corridors(c, o, g, width, color) {
      const { x, y, s, exits } = o, { cx, cy } = g;
      c.fillStyle = color;
      const hw = width/2;
      c.fillRect(cx-hw, cy-hw, width, width);                       // centre node
      if (exits&N) c.fillRect(cx-hw, y,       width, cy-y);
      if (exits&S) c.fillRect(cx-hw, cy,      width, y+s-cy);
      if (exits&E) c.fillRect(cx,    cy-hw,   x+s-cx, width);
      if (exits&W) c.fillRect(x,     cy-hw,   cx-x,   width);
    }

    const INTERIOR = {
      chamber(c, o, g) {
        const { x, y } = o, { wt, fi, def } = g;
        c.fillStyle = def.floor; c.fillRect(x+wt, y+wt, fi, fi);
        flagstones(c, o, g);
      },
      passage(c, o, g) {
        const { def } = g;
        corridors(c, o, g, g.cw, def.floor);
        // faint mortar seams along the run
        c.strokeStyle = def.fl; c.lineWidth = 0.7;
        const { cx, cy } = g, hw = g.cw/2;
        for (let d=-hw+5; d<hw; d+=7){ c.beginPath(); c.moveTo(cx+d+.5, cy-hw); c.lineTo(cx+d+.5, cy+hw); c.stroke(); }
      },
      cavern(c, o, g) {
        const { x, y, s, exits } = o, { cx, cy, fi, def, rnd } = g;
        // connect exits with rough stubs first
        corridors(c, o, g, Math.round(g.cw*0.92), def.floor);
        // irregular rock floor blob (narrower than a chamber)
        const R = fi*0.46, pts=12;
        c.fillStyle = def.floor; c.beginPath();
        for (let i=0;i<pts;i++){ const a=i/pts*Math.PI*2, rr=R*(0.78+rnd()*0.26);
          const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr; i?c.lineTo(px,py):c.moveTo(px,py); }
        c.closePath(); c.fill();
        // rubble speckle
        for (let i=0;i<26;i++){ const a=rnd()*Math.PI*2, rr=rnd()*R*0.95;
          c.fillStyle = rnd()<0.5?def.wl:def.fl;
          c.fillRect(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr, 1.5, 1.5); }
      },
      bridge(c, o, g) {
        const { x, y, s, exits } = o, { cx, cy, wt, fi, def } = g;
        // the chasm — a dark drop with depth shading
        const grad = c.createRadialGradient(cx, cy, 2, cx, cy, fi*0.7);
        grad.addColorStop(0, '#020208'); grad.addColorStop(1, '#0a0a14');
        c.fillStyle = grad; c.fillRect(x+wt, y+wt, fi, fi);
        // jagged chasm lip
        c.strokeStyle = '#000'; c.lineWidth = 1; c.strokeRect(x+wt+.5, y+wt+.5, fi-1, fi-1);
        // the bridge planks along the corridor strips
        const bw = Math.round(g.cw*0.9);
        corridors(c, o, g, bw, def.floor);
        c.strokeStyle = 'rgba(0,0,0,0.5)'; c.lineWidth = 1;
        const hw = bw/2;
        if (exits&(N|S)) for (let py=y+8; py<y+s; py+=8){ c.beginPath(); c.moveTo(cx-hw,py); c.lineTo(cx+hw,py); c.stroke(); }
        if (exits&(E|W)) for (let px=x+8; px<x+s; px+=8){ c.beginPath(); c.moveTo(px,cy-hw); c.lineTo(px,cy+hw); c.stroke(); }
      },
      well(c, o, g)    { INTERIOR.chamber(c,o,g); centrePiece(c,o,g,'well'); },
      pool(c, o, g)    { INTERIOR.chamber(c,o,g); centrePiece(c,o,g,'pool'); },
      pillared(c, o, g) {
        INTERIOR.chamber(c, o, g);
        const { fi, cx, cy } = g;
        const r = fi*0.12, off = fi*0.3;
        [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([dx,dy])=>pillar(c, cx+dx*off, cy+dy*off, r, g.def));
      },
      rubble(c, o, g) {
        INTERIOR.chamber(c, o, g);
        const { cx, cy, fi, rnd, def } = g;
        // cracks
        c.strokeStyle = '#000'; c.globalAlpha = 0.4; c.lineWidth = 1;
        c.beginPath(); c.moveTo(cx-fi*0.3, cy-fi*0.1); c.lineTo(cx, cy+fi*0.05); c.lineTo(cx+fi*0.28, cy-fi*0.12); c.stroke();
        c.globalAlpha = 1;
        // a couple of rubble piles clear of the centre
        rubblePile(c, cx-fi*0.28, cy+fi*0.26, fi*0.16, def, rnd);
        rubblePile(c, cx+fi*0.26, cy-fi*0.24, fi*0.13, def, rnd);
      },
      squeeze(c, o, g) {
        const { def } = g;
        // a crack far narrower than a normal doorway — only Pip fits
        corridors(c, o, g, Math.max(6, Math.round(g.cw*0.42)), def.floor);
        // jagged rock edges hugging the crack
        const { x, y, s, exits } = o, { cx, cy } = g, hw = Math.max(6, Math.round(g.cw*0.42))/2;
        c.fillStyle = def.wl;
        for (let i=0;i<3;i++){ const t=hw+2+i*3;
          if (exits&(N|S)){ c.fillRect(cx-t-2, cy-2+i, 2, 4); c.fillRect(cx+t, cy-4-i, 2, 4); } }
        // little mouse-hole arch at centre
        c.fillStyle = '#000'; c.beginPath(); c.arc(cx, cy+hw*0.2, hw*0.7, Math.PI, 0); c.fill();
      },
    };

    function pillar(c, px, py, r, def) {
      c.fillStyle = '#000'; c.globalAlpha=0.3; c.beginPath(); c.ellipse(px, py+r*0.5, r*1.1, r*0.5, 0, 0, 7); c.fill(); c.globalAlpha=1;
      const grad = c.createRadialGradient(px-r*0.3, py-r*0.3, 1, px, py, r);
      grad.addColorStop(0, def.wl); grad.addColorStop(1, def.wall);
      c.fillStyle = grad; c.beginPath(); c.arc(px, py, r, 0, 7); c.fill();
      c.strokeStyle = '#000'; c.globalAlpha=0.4; c.lineWidth=1; c.stroke(); c.globalAlpha=1;
    }
    function rubblePile(c, px, py, r, def, rnd) {
      for (let i=0;i<5;i++){ const a=rnd()*Math.PI*2, d=rnd()*r;
        const rr=r*(0.3+rnd()*0.35);
        c.fillStyle = i%2?def.wall:def.wl;
        c.beginPath(); c.arc(px+Math.cos(a)*d, py+Math.sin(a)*d, rr, 0, 7); c.fill();
        c.strokeStyle='#000'; c.globalAlpha=0.35; c.stroke(); c.globalAlpha=1; }
    }
    function centrePiece(c, o, g, kind) {
      const { cx, cy, fi } = g; const R = fi*0.26;
      if (kind === 'well') {
        c.fillStyle = '#3a342c'; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.fill();         // stone rim
        c.fillStyle = '#1c1812'; c.beginPath(); c.arc(cx, cy, R*0.72, 0, 7); c.fill();    // inner ring
        const w = c.createRadialGradient(cx, cy, 1, cx, cy, R*0.55);
        w.addColorStop(0,'#10202c'); w.addColorStop(1,'#05080c');
        c.fillStyle = w; c.beginPath(); c.arc(cx, cy, R*0.55, 0, 7); c.fill();            // dark water
        c.strokeStyle = 'rgba(120,160,200,0.4)'; c.lineWidth=0.8;
        c.beginPath(); c.arc(cx, cy, R*0.3, 0, 7); c.stroke();                            // shimmer
      } else { // magic pool
        const glow = c.createRadialGradient(cx, cy, 1, cx, cy, R*1.5);
        glow.addColorStop(0,'rgba(150,90,230,0.55)'); glow.addColorStop(0.5,'rgba(80,60,180,0.25)'); glow.addColorStop(1,'rgba(0,0,0,0)');
        c.fillStyle = glow; c.beginPath(); c.arc(cx, cy, R*1.5, 0, 7); c.fill();
        const p = c.createRadialGradient(cx, cy, 1, cx, cy, R);
        p.addColorStop(0,'#c8a0ff'); p.addColorStop(0.6,'#6a3fb0'); p.addColorStop(1,'#2a1850');
        c.fillStyle = p; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.fill();
        c.strokeStyle = 'rgba(220,200,255,0.5)'; c.lineWidth=0.8;
        c.beginPath(); c.arc(cx, cy, R*0.6, 0, 7); c.stroke();
        c.beginPath(); c.arc(cx, cy, R*0.32, 0, 7); c.stroke();
      }
    }

    // ── Props ───────────────────────────────────────────────────────────
    const GLOW = new Set(['torch','brazier','mushrooms','pool']);
    function anchorXY(name, o, g) {
      const { x, y, s } = o, { wt, fi } = g;
      const fx = x+wt, fy = y+wt;
      switch (name) {
        case 'center':      return [x+s/2, y+s/2];
        case 'corner-nw':   return [fx+fi*0.20, fy+fi*0.22];
        case 'corner-ne':   return [fx+fi*0.80, fy+fi*0.22];
        case 'corner-sw':   return [fx+fi*0.20, fy+fi*0.80];
        case 'corner-se':   return [fx+fi*0.80, fy+fi*0.80];
        case 'wall-top-l':  return [x+s*0.27, y+wt*0.55];
        case 'wall-top-r':  return [x+s*0.73, y+wt*0.55];
        case 'wall-left':   return [x+wt*0.55, y+s*0.5];
        case 'wall-right':  return [x+s-wt*0.55, y+s*0.5];
        case 'wall-bot-l':  return [x+s*0.27, y+s-wt*0.55];
        case 'wall-bot-r':  return [x+s*0.73, y+s-wt*0.55];
      }
      return [x+s/2, y+s/2];
    }
    function drawProp(c, p, o, g) {
      const [px, py] = anchorXY(p.anchor, o, g);
      const u = o.s/104;            // scale unit
      PROP[p.kind](c, px, py, u, g);
    }
    const PROP = {
      torch(c, px, py, u, g) {
        const glow = c.createRadialGradient(px, py+4*u, 1, px, py+4*u, 30*u);
        glow.addColorStop(0,'rgba(255,170,60,0.40)'); glow.addColorStop(1,'rgba(255,140,40,0)');
        c.fillStyle = glow; c.beginPath(); c.arc(px, py+4*u, 30*u, 0, 7); c.fill();
        c.strokeStyle = '#2a2018'; c.lineWidth = 2*u;                       // bracket
        c.beginPath(); c.moveTo(px, py+8*u); c.lineTo(px, py+2*u); c.stroke();
        c.fillStyle = '#ff7820'; c.beginPath(); c.ellipse(px, py-2*u, 3.2*u, 6*u, 0, 0, 7); c.fill();  // flame
        c.fillStyle = '#ffd060'; c.beginPath(); c.ellipse(px, py-1*u, 1.6*u, 3.4*u, 0, 0, 7); c.fill();
      },
      brazier(c, px, py, u, g) {
        const glow = c.createRadialGradient(px, py-2*u, 1, px, py-2*u, 34*u);
        glow.addColorStop(0,'rgba(255,160,50,0.45)'); glow.addColorStop(1,'rgba(255,120,30,0)');
        c.fillStyle = glow; c.beginPath(); c.arc(px, py-2*u, 34*u, 0, 7); c.fill();
        c.strokeStyle = '#1a1410'; c.lineWidth = 1.6*u;                     // legs
        c.beginPath(); c.moveTo(px-5*u, py+9*u); c.lineTo(px-2*u, py+1*u);
        c.moveTo(px+5*u, py+9*u); c.lineTo(px+2*u, py+1*u); c.stroke();
        c.fillStyle = '#2a2018'; c.beginPath();                            // bowl
        c.moveTo(px-7*u, py); c.lineTo(px+7*u, py); c.lineTo(px+5*u, py+5*u); c.lineTo(px-5*u, py+5*u); c.closePath(); c.fill();
        c.fillStyle = '#ff7820'; c.beginPath(); c.ellipse(px, py-4*u, 4*u, 7*u, 0, 0, 7); c.fill();
        c.fillStyle = '#ffd060'; c.beginPath(); c.ellipse(px, py-3*u, 2*u, 4*u, 0, 0, 7); c.fill();
      },
      rocks(c, px, py, u) {
        [[-4,1,4],[3,-1,5],[0,4,3.5]].forEach(([dx,dy,r])=>{
          c.fillStyle = '#4a4640'; c.beginPath();
          c.moveTo(px+dx*u-r*u, py+dy*u); c.lineTo(px+dx*u, py+dy*u-r*u);
          c.lineTo(px+dx*u+r*u, py+dy*u); c.lineTo(px+dx*u+r*0.5*u, py+dy*u+r*0.7*u);
          c.lineTo(px+dx*u-r*0.5*u, py+dy*u+r*0.7*u); c.closePath(); c.fill();
          c.strokeStyle='#26241f'; c.lineWidth=0.8*u; c.stroke();
        });
      },
      bones(c, px, py, u) {
        c.strokeStyle = '#d8cdb0'; c.lineWidth = 2*u; c.lineCap='round';   // crossbones
        c.beginPath(); c.moveTo(px-5*u, py+4*u); c.lineTo(px+5*u, py-1*u); c.stroke();
        c.fillStyle = '#e8e0c8'; c.beginPath(); c.arc(px-2*u, py-3*u, 4*u, 0, 7); c.fill();  // skull
        c.fillStyle = '#2a2418';
        c.beginPath(); c.arc(px-3.4*u, py-3.4*u, 1*u, 0, 7); c.fill();
        c.beginPath(); c.arc(px-0.6*u, py-3.4*u, 1*u, 0, 7); c.fill();
        c.lineCap='butt';
      },
      mushrooms(c, px, py, u) {
        const glow = c.createRadialGradient(px, py, 1, px, py, 16*u);
        glow.addColorStop(0,'rgba(80,230,200,0.30)'); glow.addColorStop(1,'rgba(80,230,200,0)');
        c.fillStyle = glow; c.beginPath(); c.arc(px, py, 16*u, 0, 7); c.fill();
        [[-3,0,2.6],[2,-2,3.2],[4,2,2.2]].forEach(([dx,dy,r])=>{
          c.strokeStyle='#cfc4a8'; c.lineWidth=1.4*u;
          c.beginPath(); c.moveTo(px+dx*u, py+dy*u+4*u); c.lineTo(px+dx*u, py+dy*u); c.stroke();
          c.fillStyle='#5be6c8'; c.beginPath(); c.arc(px+dx*u, py+dy*u, r*u, Math.PI, 0); c.fill();
        });
      },
      cobweb(c, px, py, u) {
        c.strokeStyle = 'rgba(220,220,230,0.35)'; c.lineWidth = 0.7*u;
        for (let a=0; a<Math.PI/2+0.01; a+=Math.PI/8){
          c.beginPath(); c.moveTo(px, py); c.lineTo(px+Math.cos(a)*16*u, py+Math.sin(a)*16*u); c.stroke();
        }
        for (let r=5; r<=15; r+=5){ c.beginPath(); c.arc(px, py, r*u, 0, Math.PI/2); c.stroke(); }
      },
      puddle(c, px, py, u) {
        c.fillStyle = 'rgba(40,70,90,0.55)'; c.beginPath(); c.ellipse(px, py, 9*u, 4.5*u, 0, 0, 7); c.fill();
        c.strokeStyle = 'rgba(150,190,210,0.4)'; c.lineWidth=0.8*u;
        c.beginPath(); c.ellipse(px-2*u, py-1*u, 3*u, 1.4*u, 0, 0, 7); c.stroke();
      },
      coins(c, px, py, u) {
        [[-3,1],[2,2],[0,-2],[4,-1]].forEach(([dx,dy])=>{
          c.fillStyle='#d8a82e'; c.beginPath(); c.ellipse(px+dx*u, py+dy*u, 2.6*u, 1.6*u, 0, 0, 7); c.fill();
          c.strokeStyle='#8a6a10'; c.lineWidth=0.6*u; c.stroke();
        });
        c.fillStyle = 'rgba(255,240,180,0.9)';                              // sparkle
        c.fillRect(px+1*u, py-4*u, 1*u, 1*u);
      },
    };

    // ── Gallery scaffolding ─────────────────────────────────────────────
    const DPR = Math.min(window.devicePixelRatio||1, 2.5);
    function cell(parent, capHtml, drawFn, s=104) {
      const wrap = document.createElement('div'); wrap.className='cell'; wrap.style.width=s+'px';
      const cv = document.createElement('canvas');
      cv.width = s*DPR; cv.height = s*DPR; cv.style.width=s+'px'; cv.style.height=s+'px';
      const ctx = cv.getContext('2d'); ctx.scale(DPR,DPR);
      ctx.fillStyle='#06060e'; ctx.fillRect(0,0,s,s);
      drawFn(ctx, s);
      wrap.appendChild(cv);
      const cap = document.createElement('div'); cap.className='cap'; cap.innerHTML=capHtml;
      wrap.appendChild(cap);
      parent.appendChild(wrap);
    }
    function head(sec, title, sub, btn) {
      const h = document.createElement('div'); h.className='sec-head';
      h.innerHTML = `<h3>${title}</h3><span class="sub">${sub}</span>`;
      if (btn) { const b=document.createElement('button'); b.className='btn'; b.textContent=btn.label; b.onclick=btn.onClick; h.appendChild(b); }
      sec.appendChild(h);
      const grid = document.createElement('div'); grid.className='grid'; sec.appendChild(grid);
      return grid;
    }
    const tile = o => (ctx,s) => drawTile(ctx, {x:0,y:0,s, ...o});

    // 1 ── Archetypes (neutral corridor tint so shape reads clearly) ──────
    (() => {
      const grid = head(document.getElementById('sec-arch'), 'Interior Archetypes',
        'same exits can hold any shape');
      const T = RT.CORRIDOR;
      const A = [
        ['chamber',  N|E|S|W, 'Chamber',       'the square room of today'],
        ['passage',  N|S,     'Passage',        'a real corridor, not a room'],
        ['passage',  N|E,     'Passage · bend', 'turns the corner'],
        ['passage',  N|E|S|W, 'Crossroads',     'passage with four exits'],
        ['cavern',   N|E|S,   'Cavern',         'rough rock, narrower'],
        ['bridge',   N|S,     'Chasm + Bridge', 'a pit you must cross'],
        ['well',     N|E|S|W, 'Well',           'a landmark to interact with'],
        ['pool',     N|E|S|W, 'Magic Pool',     'arcane — hints the 🟣 die'],
        ['pillared', N|E|S|W, 'Pillared Hall',  'grand; frames a boss/shop'],
        ['rubble',   N|E,     'Rubble',         'collapsed, hazardous'],
        ['squeeze',  N|S,     'Squeeze',        'only Pip fits — shortcuts'],
      ];
      A.forEach(([arch,exits,label,desc],i)=>
        cell(grid, `<b>${label}</b><br>${desc}`, tile({type:T, exits, archetype:arch, seed:i+3})));
    })();

    // 2 ── Room-type tint over one archetype ─────────────────────────────
    (() => {
      const grid = head(document.getElementById('sec-types'), 'Room-Type Layer',
        'colour + icon, unchanged');
      [RT.ENEMY,RT.SHOP,RT.NPC,RT.ITEM,RT.CHEST,RT.BOSS].forEach((t,i)=>
        cell(grid, `<b>${RDEF[t].label}</b>`, tile({type:t, exits:N|E|S|W, archetype:'chamber', seed:i+20, border:true})));
    })();

    // 3 ── Props palette ─────────────────────────────────────────────────
    (() => {
      const grid = head(document.getElementById('sec-props'), 'Props',
        'scattered on top, anchored');
      const items = [
        ['torch','wall-top-l','Wall torch','casts light'],
        ['brazier','center','Brazier','centre fire'],
        ['rocks','corner-se','Rocks','floor scatter'],
        ['bones','corner-sw','Bones','the unlucky'],
        ['mushrooms','corner-nw','Mushrooms','bio-glow'],
        ['cobweb','corner-ne','Cobweb','corner-hung'],
        ['puddle','corner-sw','Puddle','drips below'],
        ['coins','corner-se','Coin glint','treasure tease'],
      ];
      items.forEach(([kind,anchor,label,desc],i)=>
        cell(grid, `<b>${label}</b><br>${desc}`,
          tile({type:RT.CORRIDOR, exits:N|E|S|W, archetype:'chamber', seed:i+40, props:[{kind,anchor}]})));
    })();

    // 4 ── Props in use (curated set pieces) ─────────────────────────────
    (() => {
      const grid = head(document.getElementById('sec-use'), 'Props In Use',
        'layers combined');
      const ex = [
        { type:RT.ENEMY, exits:N|E|S, archetype:'cavern', cap:'Enemy <b>cavern</b><br>bones + torch',
          props:[{kind:'torch',anchor:'wall-top-r'},{kind:'bones',anchor:'corner-sw'},{kind:'rocks',anchor:'corner-se'}] },
        { type:RT.SHOP, exits:N|E|S|W, archetype:'pillared', cap:'Shop <b>pillared hall</b><br>braziers + coins',
          props:[{kind:'brazier',anchor:'wall-top-l'},{kind:'brazier',anchor:'wall-top-r'},{kind:'coins',anchor:'corner-se'}] },
        { type:RT.CORRIDOR, exits:N|S, archetype:'passage', cap:'<b>Passage</b><br>torch + puddle',
          props:[{kind:'torch',anchor:'wall-left'},{kind:'puddle',anchor:'corner-sw'}] },
        { type:RT.BOSS, exits:N|E|S|W, archetype:'pillared', cap:'Boss <b>arena</b><br>braziers + bones',
          props:[{kind:'brazier',anchor:'wall-top-l'},{kind:'brazier',anchor:'wall-top-r'},{kind:'bones',anchor:'corner-sw'},{kind:'bones',anchor:'corner-se'}] },
        { type:RT.ITEM, exits:N|E, archetype:'cavern', cap:'Item <b>grotto</b><br>mushrooms glow',
          props:[{kind:'mushrooms',anchor:'corner-sw'},{kind:'mushrooms',anchor:'corner-ne'}] },
        { type:RT.CHEST, exits:S|W, archetype:'rubble', cap:'Chest in <b>rubble</b><br>torch + cobweb',
          props:[{kind:'torch',anchor:'wall-top-l'},{kind:'cobweb',anchor:'corner-ne'},{kind:'coins',anchor:'corner-se'}] },
        { type:RT.NPC, exits:N|S, archetype:'bridge', cap:'NPC at the <b>chasm</b><br>torchlit crossing',
          props:[{kind:'torch',anchor:'wall-left'},{kind:'torch',anchor:'wall-right'}] },
        { type:RT.ITEM, exits:N|E|S|W, archetype:'pool', cap:'<b>Magic pool</b> shrine<br>mushroom-lit',
          props:[{kind:'mushrooms',anchor:'corner-nw'},{kind:'mushrooms',anchor:'corner-se'}] },
        { type:RT.START, exits:N|E|S|W, archetype:'well', cap:'<b>Well</b> chamber<br>torchlit start',
          props:[{kind:'torch',anchor:'wall-top-l'},{kind:'torch',anchor:'wall-top-r'}] },
      ];
      ex.forEach((e,i)=> cell(grid, e.cap, tile({...e, seed:i+60})));
    })();

    // 5 ── Random compositions ───────────────────────────────────────────
    const RND_TYPES = [RT.CORRIDOR,RT.ENEMY,RT.SHOP,RT.NPC,RT.ITEM,RT.CHEST,RT.BOSS];
    const ARCH_EXITS = {
      chamber:[N|E|S|W,N|E|S,N|E,N|S], passage:[N|S,E|W,N|E,S|W,N|E|S|W],
      cavern:[N|E|S,N|E,N|S,N|E|S|W], bridge:[N|S,E|W], well:[N|E|S|W,N|E|S],
      pool:[N|E|S|W,N|E|S], pillared:[N|E|S|W,N|E|S], rubble:[N|E,N|S,S|W], squeeze:[N|S,E|W],
    };
    const ARCHES = Object.keys(ARCH_EXITS);
    const FLOOR_PROPS = ['rocks','bones','mushrooms','puddle','coins','cobweb'];
    const CORNERS = ['corner-nw','corner-ne','corner-sw','corner-se'];
    function randomProps(rng) {
      const out=[];
      if (rng()<0.7) out.push({kind:'torch', anchor: rng()<0.5?'wall-top-l':'wall-top-r'});
      const n = Math.floor(rng()*3);                              // 0–2 floor props
      const corners = [...CORNERS].sort(()=>rng()-0.5);
      for (let i=0;i<n;i++) out.push({kind: FLOOR_PROPS[Math.floor(rng()*FLOOR_PROPS.length)], anchor: corners[i]});
      return out;
    }
    let rndSeed = 100;
    function fillRandom() {
      const sec = document.getElementById('sec-random');
      sec.querySelector('.grid')?.remove();
      const grid = document.createElement('div'); grid.className='grid'; sec.appendChild(grid);
      const rng = mulberry32(rndSeed++);
      for (let i=0;i<6;i++){
        const arch = ARCHES[Math.floor(rng()*ARCHES.length)];
        const exits = ARCH_EXITS[arch][Math.floor(rng()*ARCH_EXITS[arch].length)];
        const type  = RND_TYPES[Math.floor(rng()*RND_TYPES.length)];
        const props = CENTRE_FEATURE.has(arch) ? randomProps(rng).filter(p=>!p.anchor.startsWith('corner')||true) : randomProps(rng);
        cell(grid, `<b>${RDEF[type].label}</b><br>${arch}`,
          tile({type, exits, archetype:arch, props, seed: Math.floor(rng()*1e6)}));
      }
    }
    head(document.getElementById('sec-random'), 'Random Mix', 'composer output',
      { label:'Reroll', onClick: fillRandom });
    fillRandom();
  </script>
</body>
