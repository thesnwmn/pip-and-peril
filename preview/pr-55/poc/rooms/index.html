<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0, user-scalable=no">
  <title>POC 5 — Room Selection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d1a;
      color: #e8d5b0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      gap: 10px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      width: 360px;
    }
    header h2 { font-size: 13px; opacity: 0.55; letter-spacing: 2px; text-transform: uppercase; }
    header a   { color: #c8941e; text-decoration: none; font-size: 12px; opacity: 0.7; }

    #c { display: block; cursor: pointer; border: 1px solid #1a1a38; border-radius: 4px; }

    #hint {
      font-size: 11px; color: #4a3a28; text-align: center;
      width: 360px; min-height: 16px;
    }

    /* Choice cards (shown when picking a room) */
    .choice-row { display: flex; gap: 8px; width: 360px; }
    .choice-card {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 8px 4px 6px;
      border-radius: 10px; border: 2px solid;
      cursor: pointer;
      transition: filter 0.1s, transform 0.1s;
      font-family: monospace;
    }
    .choice-card:hover  { filter: brightness(1.3); transform: translateY(-2px); }
    .choice-card:active { transform: translateY(0); }
    .choice-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: bold; }

    /* Event log */
    #log {
      width: 360px;
      background: #0a0a16; border: 1px solid #181830;
      border-radius: 8px; padding: 8px 10px;
      display: flex; flex-direction: column; gap: 3px;
      min-height: 62px;
    }
    .log-entry  { font-size: 11px; line-height: 1.45; }
    .log-normal { color: #6b5a45; }
    .log-system { color: #c8941e; }
    .log-enemy  { color: #ff8070; }
    .log-boss   { color: #ff4040; font-weight: bold; }
    .log-shop   { color: #f0c060; }
    .log-npc    { color: #70b8f0; }
    .log-item   { color: #60d080; }
    .log-chest  { color: #f0a060; }

    .controls {
      display: flex; align-items: center; justify-content: space-between;
      width: 360px;
    }
    #step-info { font-size: 12px; color: #6b5a45; }
    #step-info span { color: #c8941e; }
    .btn {
      padding: 8px 18px; background: #c8941e; color: #0d0d1a;
      border: none; border-radius: 8px;
      font-size: 12px; font-weight: bold; cursor: pointer;
      font-family: monospace; letter-spacing: 0.05em;
    }
    .btn:hover { background: #e0a830; }
  </style>
</head>
<body>
  <header>
    <a href="../../">← Back</a>
    <h2>POC 5 — Room Selection</h2>
    <span></span>
  </header>

  <canvas id="c"></canvas>
  <div id="hint"></div>
  <div id="panel"></div>
  <div id="log"></div>
  <div class="controls">
    <div id="step-info">Steps: <span id="steps">0</span></div>
    <button class="btn" id="new-btn">New Dungeon</button>
  </div>

  <script>
    // ── Directions ────────────────────────────────────────────────────────
    const N=1, E=2, S=4, W=8;
    const DIR_LIST = [N,E,S,W];
    const OPP    = { [N]:S, [S]:N, [E]:W, [W]:E };
    const DDELTA = { [N]:[0,-1], [E]:[1,0], [S]:[0,1], [W]:[-1,0] };
    const DARROW = { [N]:'↑', [E]:'→', [S]:'↓', [W]:'←' };

    function d2dir(dc, dr) {
      if (dc===0 && dr===-1) return N;
      if (dc===1 && dr===0)  return E;
      if (dc===0 && dr===1)  return S;
      if (dc===-1 && dr===0) return W;
      return 0;
    }

    // ── Room types ────────────────────────────────────────────────────────
    const RT = { START:0, CORRIDOR:1, ENEMY:2, SHOP:3, NPC:4, ITEM:5, CHEST:6, BOSS:7 };

    // Each entry: wall/wl (wall light) = stone wall colours
    //             floor/fl = floor tile/mortar colours
    //             text/border = room type accent
    const RDEF = {
      [RT.START]:    { label:'Start',    icon:'▼', wall:'#0e130e', wl:'#141e14', floor:'#1e2e1e', fl:'#182618', text:'#90e090', border:'#60c080', lc:'system' },
      [RT.CORRIDOR]: { label:'Corridor', icon:'',  wall:'#161210', wl:'#1e1a16', floor:'#2e2620', fl:'#262018', text:'#9a8a7a', border:'#504840', lc:'normal' },
      [RT.ENEMY]:    { label:'Enemy',    icon:'⚔', wall:'#180808', wl:'#220e0c', floor:'#2e1010', fl:'#261010', text:'#ff8070', border:'#c0392b', lc:'enemy'  },
      [RT.SHOP]:     { label:'Shop',     icon:'⚖', wall:'#161000', wl:'#201800', floor:'#2c2010', fl:'#241a0c', text:'#f0c060', border:'#c8941e', lc:'shop'   },
      [RT.NPC]:      { label:'NPC',      icon:'◎', wall:'#0a0e18', wl:'#10162a', floor:'#121e30', fl:'#0e1826', text:'#70b8f0', border:'#2980b9', lc:'npc'    },
      [RT.ITEM]:     { label:'Item',     icon:'✦', wall:'#0a1008', wl:'#0e1810', floor:'#142014', fl:'#101c10', text:'#60d080', border:'#27ae60', lc:'item'   },
      [RT.CHEST]:    { label:'Chest',    icon:'⊞', wall:'#140e00', wl:'#1c1400', floor:'#281808', fl:'#201408', text:'#f0a060', border:'#e67e22', lc:'chest'  },
      [RT.BOSS]:     { label:'Boss',     icon:'☠', wall:'#100000', wl:'#1a0000', floor:'#200000', fl:'#180000', text:'#ff4040', border:'#8e1010', lc:'boss'   },
    };

    // ── Exit configurations ───────────────────────────────────────────────
    const ALL_EXITS = [
      N, E, S, W,                          // dead ends
      N|S, E|W,                            // straight
      N|E, N|W, S|E, S|W,                  // corners
      N|E|S, N|W|S, E|S|W, N|E|W,         // T-junctions
      N|E|S|W,                             // crossroads
    ];

    // ── Room type pools by depth ──────────────────────────────────────────
    const POOLS = [
      [RT.CORRIDOR,RT.CORRIDOR,RT.ENEMY,RT.SHOP,RT.NPC,RT.ITEM,RT.CHEST],
      [RT.CORRIDOR,RT.ENEMY,RT.ENEMY,RT.SHOP,RT.CHEST,RT.NPC,RT.ITEM],
      [RT.ENEMY,RT.ENEMY,RT.ENEMY,RT.CHEST,RT.ITEM,RT.SHOP,RT.BOSS],
    ];
    const poolFor = d => d<=2 ? POOLS[0] : d<=4 ? POOLS[1] : POOLS[2];

    // ── Encounter flavour ─────────────────────────────────────────────────
    const MSGS = {
      [RT.CORRIDOR]: ['A quiet passage...','Dusty corridors. Cobwebs and silence.','The torchlight wavers. Nothing lurks.'],
      [RT.ENEMY]:    ['A dungeon rat leaps at you!','An enemy bars the way!','Something snarls in the dark.','Claws scrape on stone.'],
      [RT.SHOP]:     ['A merchant grins at your coin pouch.','Strange wares in the torchlight.','The shopkeeper nods warily.'],
      [RT.NPC]:      ['A wounded adventurer slumps here.','A stranger whispers a warning.','A robed figure stares silently.'],
      [RT.ITEM]:     ['Something glints in the rubble.','A useful tool left behind.','Discarded by a previous delver.'],
      [RT.CHEST]:    ['A locked chest — worth the risk?','Gold light spills from the lid.','Heavy iron lock, weak hinges.'],
      [RT.BOSS]:     ['THE FLOOR SHAKES.','A BOSS lurks here. No retreat.'],
    };
    const SURPRISE = {
      [RT.ENEMY]: ['Wait — it bolts on sight.','Already dead.'],
      [RT.SHOP]:  ['Sold out. Bare shelves.','Nobody home.'],
      [RT.CHEST]: ['Empty. Someone got here first.','A decoy — just rocks.'],
      [RT.NPC]:   ['They say nothing. Just point deeper.'],
      [RT.ITEM]:  ['Broken beyond use.','Cursed. You leave it.'],
    };

    // ── Canvas & layout ───────────────────────────────────────────────────
    const VP      = 5;       // viewport tiles per side (5×5)
    const VP_HALF = 2;       // floor(VP/2)
    const TS      = 68;      // tile size px
    const TGAP    = 5;       // gap between tiles px
    const CW      = VP*TS + (VP-1)*TGAP;   // 360

    const MAP_SIZE = 13;     // map grid (13×13)
    const MAP_MID  = 6;      // center cell index

    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    canvas.width = canvas.height = CW;

    // ── State ─────────────────────────────────────────────────────────────
    let grid, px, py, stepCount, uiState, pendingDir, offerings, eventLog;
    // uiState: 'pick-dir' | 'pick-room'

    // ── Utilities ─────────────────────────────────────────────────────────
    const pick    = a => a[0|Math.random()*a.length];
    const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b; };
    const inBounds = (x,y) => x>=0 && x<MAP_SIZE && y>=0 && y<MAP_SIZE;
    const getCell  = (x,y) => (grid[y]??[])[x] ?? null;
    const setCell  = (x,y,c) => { if (grid[y]) grid[y][x]=c; };
    const dist     = (x,y) => Math.max(Math.abs(x-MAP_MID), Math.abs(y-MAP_MID));

    // Viewport cell (vc, vr) → canvas top-left pixel
    const vpx = vc => vc * (TS + TGAP);
    const vpy = vr => vr * (TS + TGAP);

    // ── Tile renderer ─────────────────────────────────────────────────────
    // Works at any size s. Used for map (s=TS=68) and choice previews (s=76).
    function drawTile(c, type, exits, x, y, s, opts = {}) {
      const def = RDEF[type];
      const wt  = Math.round(s * 0.191);  // wall thickness: ~13px @68
      const cw  = Math.round(s * 0.382);  // corridor width:  ~26px @68
      const co  = Math.round((s-cw)/2);   // corridor offset: ~21px @68
      const fi  = s - wt*2;               // inner floor size: ~42px @68

      // ── Stone wall fill ──
      c.fillStyle = def.wall;
      c.fillRect(x, y, s, s);

      // Horizontal stone courses
      c.fillStyle = def.wl;
      for (let ly = 5; ly < s; ly += 7) c.fillRect(x, y+ly, s, 1);

      // ── Inner floor ──
      c.fillStyle = def.floor;
      c.fillRect(x+wt, y+wt, fi, fi);

      // Flagstone grid (3×3)
      const fs = Math.floor(fi/3);
      c.strokeStyle = def.fl;
      c.lineWidth = 0.7;
      for (let r=0; r<3; r++)
        for (let cc=0; cc<3; cc++)
          c.strokeRect(x+wt+cc*fs+0.5, y+wt+r*fs+0.5, fs, fs);

      // ── Exit corridors (punch wall with floor colour) ──
      c.fillStyle = def.floor;
      if (exits&N) c.fillRect(x+co,   y,       cw, wt+1);
      if (exits&S) c.fillRect(x+co,   y+s-wt,  cw, wt+1);
      if (exits&E) c.fillRect(x+s-wt, y+co,    wt+1, cw);
      if (exits&W) c.fillRect(x,      y+co,    wt+1, cw);

      // Door-frame lines (thin lines marking corridor edges, help read exit type)
      c.strokeStyle = def.wl;
      c.lineWidth = 0.9;
      function lv(lx,y1,y2){ c.beginPath(); c.moveTo(lx+.5,y1); c.lineTo(lx+.5,y2); c.stroke(); }
      function lh(ly,x1,x2){ c.beginPath(); c.moveTo(x1,ly+.5); c.lineTo(x2,ly+.5); c.stroke(); }
      if (exits&N){ lv(x+co, y, y+wt); lv(x+co+cw, y, y+wt); }
      if (exits&S){ lv(x+co, y+s-wt, y+s); lv(x+co+cw, y+s-wt, y+s); }
      if (exits&E){ lh(y+co, x+s-wt, x+s); lh(y+co+cw, x+s-wt, x+s); }
      if (exits&W){ lh(y+co, x, x+wt); lh(y+co+cw, x, x+wt); }

      // ── Room icon ──
      if (def.icon) {
        c.fillStyle    = def.text;
        c.font         = `bold ${Math.round(s*0.29)}px serif`;
        c.textAlign    = 'center';
        c.textBaseline = 'middle';
        c.fillText(def.icon, x+s/2, y+s/2+1);
      }

      // ── Type border (for choice previews) ──
      if (opts.border) {
        c.strokeStyle = def.border;
        c.lineWidth   = 2.5;
        c.strokeRect(x+1.5, y+1.5, s-3, s-3);
      }

      // ── Current-tile treatment: Pip + golden border ──
      if (opts.current) {
        const cx = x+s/2, cy = y+s/2;
        const r  = Math.max(7, s*0.21);

        // Body
        c.fillStyle = '#f5e6c8';
        c.beginPath(); c.arc(cx, cy+1, r, 0, Math.PI*2); c.fill();
        // Ears
        const er = r*0.42;
        c.fillStyle = '#e0c8a0';
        c.beginPath(); c.arc(cx-r*.55, cy-r*.72, er, 0, Math.PI*2); c.fill();
        c.beginPath(); c.arc(cx+r*.55, cy-r*.72, er, 0, Math.PI*2); c.fill();
        c.fillStyle = 'rgba(200,100,80,0.5)';
        c.beginPath(); c.arc(cx-r*.55, cy-r*.72, er*.55, 0, Math.PI*2); c.fill();
        c.beginPath(); c.arc(cx+r*.55, cy-r*.72, er*.55, 0, Math.PI*2); c.fill();
        // Eye
        c.fillStyle = '#3d2b1f';
        c.beginPath(); c.arc(cx+r*.28, cy-r*.05, r*.16, 0, Math.PI*2); c.fill();
        // Nose
        c.fillStyle = '#c87060';
        c.beginPath(); c.arc(cx+r*.48, cy+r*.3, r*.12, 0, Math.PI*2); c.fill();

        // Golden tile border
        c.strokeStyle = '#c8941e';
        c.lineWidth   = 2;
        c.strokeRect(x+1, y+1, s-2, s-2);
      }

      // Subtle drop shadow (bottom + right edge)
      c.fillStyle = 'rgba(0,0,0,0.25)';
      c.fillRect(x, y+s-2, s, 2);
      c.fillRect(x+s-2, y, 2, s);
    }

    // ── Direction arrow (drawn on unknown target tiles) ───────────────────
    function drawNavArrow(cx, cy, dir) {
      const sz = 13;
      ctx.fillStyle = 'rgba(200,148,30,0.9)';
      ctx.shadowColor = 'rgba(200,148,30,0.5)';
      ctx.shadowBlur  = 6;
      ctx.beginPath();
      switch(dir) {
        case N: ctx.moveTo(cx,    cy-sz); ctx.lineTo(cx-sz, cy+sz*.6); ctx.lineTo(cx+sz, cy+sz*.6); break;
        case S: ctx.moveTo(cx,    cy+sz); ctx.lineTo(cx-sz, cy-sz*.6); ctx.lineTo(cx+sz, cy-sz*.6); break;
        case E: ctx.moveTo(cx+sz, cy);    ctx.lineTo(cx-sz*.6, cy-sz); ctx.lineTo(cx-sz*.6, cy+sz); break;
        case W: ctx.moveTo(cx-sz, cy);    ctx.lineTo(cx+sz*.6, cy-sz); ctx.lineTo(cx+sz*.6, cy+sz); break;
      }
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // ── Main render ───────────────────────────────────────────────────────
    function render() {
      ctx.fillStyle = '#06060e';
      ctx.fillRect(0, 0, CW, CW);

      const avail = (uiState === 'pick-dir') ? availableDirs() : [];

      for (let vr = 0; vr < VP; vr++) {
        for (let vc = 0; vc < VP; vc++) {
          const mc = px - VP_HALF + vc;   // map column
          const mr = py - VP_HALF + vr;   // map row
          const tx = vpx(vc), ty = vpy(vr);

          if (!inBounds(mc, mr)) {
            // Outside map — void
            ctx.fillStyle = '#04040a';
            ctx.fillRect(tx, ty, TS, TS);
            continue;
          }

          const cell      = getCell(mc, mr);
          const isCurrent = (mc === px && mr === py);

          if (!cell) {
            // Unknown tile
            ctx.fillStyle = '#0c0c1e';
            ctx.fillRect(tx, ty, TS, TS);

            // Subtle brick hint in darkness
            ctx.fillStyle = '#111130';
            for (let ly = 5; ly < TS; ly += 8) ctx.fillRect(tx, ty+ly, TS, 1);

            // Nav arrow if this adjacent unknown tile is reachable
            const dc = mc-px, dr = mr-py;
            if (Math.abs(dc)+Math.abs(dr) === 1) {
              const d = d2dir(dc, dr);
              if (d && avail.includes(d)) drawNavArrow(tx+TS/2, ty+TS/2, d);
            }
          } else {
            drawTile(ctx, cell.type, cell.exits, tx, ty, TS, { current: isCurrent });
          }
        }
      }

      renderPanel();
    }

    // ── Panel: empty (pick-dir) or 3 choice cards (pick-room) ────────────
    function renderPanel() {
      const panel = document.getElementById('panel');
      const hint  = document.getElementById('hint');
      panel.innerHTML = '';

      if (uiState === 'pick-dir') {
        const avail = availableDirs();
        hint.textContent = avail.length
          ? 'Tap an adjacent tile to move there'
          : 'Dead end — no exits from here';
        return;
      }

      // pick-room: show 3 choice cards
      hint.textContent = 'Choose a room to reveal';
      const row = document.createElement('div');
      row.className = 'choice-row';

      offerings.forEach((o, i) => {
        const def  = RDEF[o.type];
        const card = document.createElement('button');
        card.className        = 'choice-card';
        card.style.borderColor = def.border;
        card.style.background  = def.wall;

        // Mini tile canvas at 76px (fits comfortably in ~108px card)
        const mc   = document.createElement('canvas');
        mc.width = mc.height = 76;
        const mctx = mc.getContext('2d');
        mctx.fillStyle = '#06060e';
        mctx.fillRect(0, 0, 76, 76);
        drawTile(mctx, o.type, o.exits, 0, 0, 76, { border: true });
        card.appendChild(mc);

        const lbl       = document.createElement('span');
        lbl.className   = 'choice-label';
        lbl.style.color = def.text;
        lbl.textContent = def.label;
        card.appendChild(lbl);

        card.addEventListener('click', () => placeRoom(i));
        row.appendChild(card);
      });
      panel.appendChild(row);
    }

    // ── Available directions from current tile ────────────────────────────
    function availableDirs() {
      const cell = getCell(px, py);
      if (!cell) return [];
      return DIR_LIST.filter(d => {
        if (!(cell.exits & d)) return false;
        const [dx,dy] = DDELTA[d];
        const nx=px+dx, ny=py+dy;
        if (!inBounds(nx,ny)) return false;
        const adj = getCell(nx,ny);
        return !adj || !!(adj.exits & OPP[d]);
      });
    }

    // ── Constrained exit configs for a new tile ───────────────────────────
    function validExitConfigs(nx, ny, entryDir) {
      let forced=entryDir, forbidden=0;
      for (const d of DIR_LIST) {
        const [dx,dy]=DDELTA[d];
        const ax=nx+dx, ay=ny+dy;
        if (!inBounds(ax,ay)) { forbidden|=d; continue; }
        const adj = getCell(ax,ay);
        if (!adj) continue;
        if (adj.exits & OPP[d]) forced   |= d;
        else                    forbidden |= d;
      }
      const valid = ALL_EXITS.filter(c => (c&forced)===forced && (c&forbidden)===0);
      if (!valid.length) valid.push(forced);
      return valid;
    }

    // ── Generate 3 room-type+exit offerings ──────────────────────────────
    function generateOfferings(nx, ny, entryDir) {
      const d    = dist(nx, ny);
      const pool = shuffle([...new Set(poolFor(d))]);
      const types = pool.slice(0, 3);
      while (types.length < 3) types.push(pick(pool));

      const cfgs = shuffle(validExitConfigs(nx, ny, entryDir));
      while (cfgs.length < 3) cfgs.push(cfgs[cfgs.length-1]);

      // Prefer distinct configs
      const used=new Set(), finalCfgs=[];
      for (const c of cfgs) {
        if (!used.has(c)) { finalCfgs.push(c); used.add(c); }
        if (finalCfgs.length===3) break;
      }
      while (finalCfgs.length<3) finalCfgs.push(cfgs[0]);

      return types.map((type,i) => ({ type, exits: finalCfgs[i] }));
    }

    // ── Direction picked (move or start room selection) ───────────────────
    function pickDirection(dir) {
      if (uiState !== 'pick-dir') return;
      const [dx,dy]=DDELTA[dir];
      const nx=px+dx, ny=py+dy;
      const existing = getCell(nx,ny);

      if (existing) {
        px=nx; py=ny; stepCount++;
        document.getElementById('steps').textContent = stepCount;
        addLog(`[Move] Back to ${RDEF[existing.type].label}.`, 'normal');
        render(); return;
      }

      pendingDir = dir;
      offerings  = generateOfferings(nx, ny, OPP[dir]);
      uiState    = 'pick-room';
      render();
    }

    // ── Room type chosen ──────────────────────────────────────────────────
    function placeRoom(idx) {
      if (uiState !== 'pick-room' || pendingDir === null) return;
      const o=offerings[idx];
      const [dx,dy]=DDELTA[pendingDir];
      const nx=px+dx, ny=py+dy;

      setCell(nx, ny, { type:o.type, exits:o.exits });
      px=nx; py=ny; stepCount++;
      document.getElementById('steps').textContent = stepCount;
      logEncounter(o.type);

      pendingDir=null; offerings=[]; uiState='pick-dir';
      render();
    }

    // ── Log ───────────────────────────────────────────────────────────────
    function addLog(msg, cls='normal') {
      eventLog.unshift({ msg, cls });
      if (eventLog.length > 5) eventLog.pop();
      document.getElementById('log').innerHTML =
        eventLog.map((e,i) =>
          `<div class="log-entry log-${e.cls}" style="opacity:${(1-i*.2).toFixed(2)}">${e.msg}</div>`
        ).join('');
    }

    function logEncounter(type) {
      if (type===RT.START) return;
      const def=RDEF[type], msgs=MSGS[type]||['You enter the room.'];
      let msg=pick(msgs);
      const sur=SURPRISE[type];
      if (sur && Math.random()<0.2) msg += ' ' + pick(sur);
      addLog(`[${def.label}] ${msg}`, def.lc);
    }

    // ── Canvas click: tap a tile to navigate there ────────────────────────
    canvas.addEventListener('click', e => {
      if (uiState !== 'pick-dir') return;
      const rect  = canvas.getBoundingClientRect();
      const scale = CW / rect.width;
      const mx = (e.clientX-rect.left)*scale;
      const my = (e.clientY-rect.top)*scale;

      const vc = Math.floor(mx / (TS+TGAP));
      const vr = Math.floor(my / (TS+TGAP));
      if (vc<0||vc>=VP||vr<0||vr>=VP) return;

      const mc=px-VP_HALF+vc, mr=py-VP_HALF+vr;
      if (!inBounds(mc,mr)) return;

      const dc=mc-px, dr=mr-py;
      if (Math.abs(dc)+Math.abs(dr) !== 1) return;
      const dir = d2dir(dc, dr);
      if (dir && availableDirs().includes(dir)) pickDirection(dir);
    });

    // ── Keyboard: WASD / arrows ───────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (uiState !== 'pick-dir') return;
      const k = {ArrowUp:N,w:N,W:N, ArrowDown:S,s:S,S:S,
                 ArrowRight:E,d:E,D:E, ArrowLeft:W,a:W,A:W}[e.key];
      if (!k) return;
      e.preventDefault();
      if (availableDirs().includes(k)) pickDirection(k);
    });

    // ── Init ─────────────────────────────────────────────────────────────
    function init() {
      grid       = Array.from({length:MAP_SIZE}, ()=>Array(MAP_SIZE).fill(null));
      px=py      = MAP_MID;
      stepCount  = 0;
      uiState    = 'pick-dir';
      pendingDir = null;
      offerings  = [];
      eventLog   = [];

      setCell(MAP_MID, MAP_MID, { type:RT.START, exits:N|E|S|W });

      document.getElementById('steps').textContent = 0;
      document.getElementById('log').innerHTML = '';
      addLog('[Start] Pip descends into the dungeon...', 'system');
      render();
    }

    document.getElementById('new-btn').addEventListener('click', init);
    init();
  </script>
</body>
</html>
