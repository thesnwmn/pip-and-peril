<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0, user-scalable=no">
  <title>POC 2 — Dice Pool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d1a;
      color: #e8d5b0;
      font-family: Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      gap: 16px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 390px;
    }
    header h2 { font-size: 13px; opacity: 0.55; letter-spacing: 2px; text-transform: uppercase; font-family: monospace; }
    header a { color: #c8941e; text-decoration: none; font-size: 12px; opacity: 0.7; font-family: monospace; }

    /* --- Dice tray --- */
    .dice-tray {
      display: flex;
      gap: 12px;
      padding: 16px;
      background: #14142a;
      border: 1px solid #2a1f15;
      border-radius: 14px;
      width: 100%;
      max-width: 390px;
      justify-content: center;
    }
    .die-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .die-label { font-size: 10px; opacity: 0.5; letter-spacing: 0.08em; font-family: monospace; }
    .die {
      width: 68px; height: 68px;
      border-radius: 14px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      cursor: default;
      transition: transform 0.08s;
      position: relative;
    }
    .die::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.4), inset 0 3px 6px rgba(255,255,255,0.12);
      pointer-events: none;
    }
    .die.red    { background: #8b1a1a; }
    .die.blue   { background: #1a3a8b; }
    .die.green  { background: #1a7a2a; }
    .die.yellow { background: #8b7200; }

    .pip-slot { display: flex; align-items: center; justify-content: center; }
    .pip-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.88);
      transition: opacity 0.1s;
    }
    .pip-dot.off { opacity: 0; }

    @keyframes shake {
      0%   { transform: rotate(0deg)   scale(1);    }
      15%  { transform: rotate(-18deg) scale(1.12); }
      30%  { transform: rotate(14deg)  scale(0.92); }
      50%  { transform: rotate(-10deg) scale(1.08); }
      70%  { transform: rotate(6deg)   scale(0.97); }
      85%  { transform: rotate(-4deg)  scale(1.03); }
      100% { transform: rotate(0deg)   scale(1);    }
    }
    .die.rolling { animation: shake 0.55s ease; }

    /* --- Pip totals --- */
    .pip-totals {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .pip-count {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9em;
      font-family: monospace;
      font-weight: bold;
      min-width: 70px;
      justify-content: center;
    }
    .pip-count.red    { background: #3a0a0a; color: #ff9090; border: 1px solid #5a1a1a; }
    .pip-count.blue   { background: #0a1040; color: #90aaff; border: 1px solid #1a2a60; }
    .pip-count.green  { background: #0a2a0a; color: #90ff90; border: 1px solid #1a5a1a; }
    .pip-count.yellow { background: #2a2000; color: #ffe060; border: 1px solid #4a3a00; }
    .pip-count .val { font-size: 1.3em; }

    /* --- Roll button --- */
    .btn-roll {
      padding: 13px 40px;
      background: #c8941e;
      color: #0d0d1a;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      font-weight: bold;
      font-family: Georgia, serif;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.05em;
    }
    .btn-roll:hover  { background: #e0a830; }
    .btn-roll:active { transform: scale(0.96); }
    .btn-roll:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* --- Actions --- */
    .section-title {
      font-size: 11px;
      opacity: 0.4;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: monospace;
      align-self: flex-start;
      margin-left: max(0px, calc(50% - 180px));
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 390px;
    }
    .action-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #14142a;
      border: 1px solid #2a1f15;
      border-radius: 10px;
      color: #e8d5b0;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
      text-align: left;
    }
    .action-btn:hover:not(:disabled) { background: #1c1c36; border-color: #5a4835; }
    .action-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .action-btn .action-name { font-size: 0.95em; }
    .action-btn .action-desc { font-size: 0.72em; color: #6b5843; margin-top: 2px; }
    .action-btn .action-left { display: flex; flex-direction: column; }
    .action-btn .cost-pills { display: flex; gap: 4px; flex-shrink: 0; }
    .cost-pill {
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: bold;
      font-family: monospace;
    }
    .cost-pill.red    { background: #5a1010; color: #ffaaaa; }
    .cost-pill.blue   { background: #10205a; color: #aac0ff; }
    .cost-pill.green  { background: #104a10; color: #aaeeaa; }
    .cost-pill.yellow { background: #3a3000; color: #ffee80; }

    .action-btn.insufficient { animation: flash-red 0.35s ease; }
    @keyframes flash-red {
      0%  { border-color: #c03030; background: #2a1010; }
      100%{ border-color: #2a1f15; background: #14142a; }
    }

    /* --- Result log --- */
    #log {
      width: 100%;
      max-width: 390px;
      min-height: 52px;
      font-size: 13px;
      line-height: 1.6;
      color: #8b7355;
      font-family: monospace;
      padding: 0 4px;
    }
    #log .entry { color: #c8b090; }
    #log .entry.fail { color: #c05050; }
    #log .entry.ok   { color: #60c060; }

    .hint { font-size: 11px; opacity: 0.3; }
  </style>
</head>
<body>
  <header>
    <a href="../../">← Back</a>
    <h2>POC 2 — Dice Pool</h2>
    <span></span>
  </header>

  <!-- Dice tray -->
  <div class="dice-tray">
    <div class="die-wrap">
      <div class="die red" id="die-red" data-color="red" data-val="0"></div>
      <div class="die-label">🔴 STR</div>
    </div>
    <div class="die-wrap">
      <div class="die blue" id="die-blue" data-color="blue" data-val="0"></div>
      <div class="die-label">🔵 INT</div>
    </div>
    <div class="die-wrap">
      <div class="die green" id="die-green" data-color="green" data-val="0"></div>
      <div class="die-label">🟢 AGI</div>
    </div>
    <div class="die-wrap">
      <div class="die yellow" id="die-yellow" data-color="yellow" data-val="0"></div>
      <div class="die-label">🟡 LCK</div>
    </div>
  </div>

  <!-- Pip totals -->
  <div class="pip-totals">
    <div class="pip-count red">   🔴 <span class="val" id="pips-red">—</span></div>
    <div class="pip-count blue">  🔵 <span class="val" id="pips-blue">—</span></div>
    <div class="pip-count green"> 🟢 <span class="val" id="pips-green">—</span></div>
    <div class="pip-count yellow">🟡 <span class="val" id="pips-yellow">—</span></div>
  </div>

  <button class="btn-roll" id="roll-btn">Roll Dice</button>

  <div class="section-title">Actions</div>

  <!-- Action buttons -->
  <div class="actions">
    <button class="action-btn" id="act-strike" disabled
      data-red="2" data-blue="0" data-green="0" data-yellow="0">
      <div class="action-left">
        <span class="action-name">⚔️ Strike</span>
        <span class="action-desc">Attack — deal 3 damage</span>
      </div>
      <div class="cost-pills"><span class="cost-pill red">2 🔴</span></div>
    </button>
    <button class="action-btn" id="act-dodge" disabled
      data-red="0" data-blue="0" data-green="2" data-yellow="0">
      <div class="action-left">
        <span class="action-name">💨 Dodge</span>
        <span class="action-desc">Agility — avoid the next attack</span>
      </div>
      <div class="cost-pills"><span class="cost-pill green">2 🟢</span></div>
    </button>
    <button class="action-btn" id="act-trick" disabled
      data-red="0" data-blue="3" data-green="0" data-yellow="0">
      <div class="action-left">
        <span class="action-name">🧠 Trick</span>
        <span class="action-desc">Intellect — confuse and stun enemy</span>
      </div>
      <div class="cost-pills"><span class="cost-pill blue">3 🔵</span></div>
    </button>
    <button class="action-btn" id="act-fortune" disabled
      data-red="0" data-blue="0" data-green="0" data-yellow="1">
      <div class="action-left">
        <span class="action-name">🍀 Fortune</span>
        <span class="action-desc">Luck — gain 2 pips of any colour</span>
      </div>
      <div class="cost-pills"><span class="cost-pill yellow">1 🟡</span></div>
    </button>
  </div>

  <div id="log"></div>
  <div class="hint">Roll first, then spend pips on actions</div>

  <script>
    // Pip active slots for each die face value (3×3 grid, index 0-8)
    // Slots: 0 1 2 / 3 4 5 / 6 7 8
    const PIP_SLOTS = {
      1: [4],
      2: [2, 6],
      3: [2, 4, 6],
      4: [0, 2, 6, 8],
      5: [0, 2, 4, 6, 8],
      6: [0, 2, 3, 5, 6, 8],
    };

    const COLORS = ['red', 'blue', 'green', 'yellow'];

    // Current pip reserves
    const pips = { red: 0, blue: 0, green: 0, yellow: 0 };
    let rolled  = false;
    let rolling = false;

    // Build the 3×3 pip grid inside each die element
    function buildDieGrid(el) {
      el.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const slot = document.createElement('div');
        slot.className = 'pip-slot';
        const dot = document.createElement('div');
        dot.className = 'pip-dot off';
        dot.dataset.slot = i;
        slot.appendChild(dot);
        el.appendChild(slot);
      }
    }

    function setDieValue(el, val) {
      el.dataset.val = val;
      const active = PIP_SLOTS[val] || [];
      el.querySelectorAll('.pip-dot').forEach(dot => {
        dot.classList.toggle('off', !active.includes(+dot.dataset.slot));
      });
    }

    // Initialise dice grids
    COLORS.forEach(c => buildDieGrid(document.getElementById(`die-${c}`)));

    // Render pip totals
    function updateTotals() {
      COLORS.forEach(c => {
        document.getElementById(`pips-${c}`).textContent = rolled ? pips[c] : '—';
      });
    }

    function updateActions() {
      document.querySelectorAll('.action-btn').forEach(btn => {
        if (!rolled) { btn.disabled = true; return; }
        const costs = { red: +btn.dataset.red, blue: +btn.dataset.blue, green: +btn.dataset.green, yellow: +btn.dataset.yellow };
        btn.disabled = !COLORS.every(c => pips[c] >= costs[c]);
      });
    }

    function log(msg, type = '') {
      const el = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'entry ' + type;
      entry.textContent = msg;
      el.innerHTML = '';
      el.appendChild(entry);
    }

    // --- Roll ---
    document.getElementById('roll-btn').addEventListener('click', () => {
      if (rolling) return;
      rolling = true;
      rolled  = false;
      const btn = document.getElementById('roll-btn');
      btn.disabled = true;
      updateActions();

      const dies   = COLORS.map(c => document.getElementById(`die-${c}`));
      const finals = COLORS.map(() => Math.ceil(Math.random() * 6));

      dies.forEach(d => d.classList.add('rolling'));

      // Scramble during animation
      let ticks = 0;
      const scramble = setInterval(() => {
        COLORS.forEach((c, i) => setDieValue(document.getElementById(`die-${c}`), Math.ceil(Math.random() * 6)));
        if (++ticks > 10) {
          clearInterval(scramble);
          // Settle on final values
          COLORS.forEach((c, i) => {
            const el = document.getElementById(`die-${c}`);
            el.classList.remove('rolling');
            setDieValue(el, finals[i]);
            pips[c] = finals[i];
          });
          rolled  = true;
          rolling = false;
          btn.disabled = false;
          updateTotals();
          updateActions();
          log(`Rolled: 🔴${pips.red}  🔵${pips.blue}  🟢${pips.green}  🟡${pips.yellow}`);
        }
      }, 50);
    });

    // --- Spend action ---
    document.querySelectorAll('.action-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        const costs = { red: +btn.dataset.red, blue: +btn.dataset.blue, green: +btn.dataset.green, yellow: +btn.dataset.yellow };

        // Verify still affordable (pips may have been spent)
        if (!COLORS.every(c => pips[c] >= costs[c])) {
          btn.classList.remove('insufficient');
          void btn.offsetWidth;
          btn.classList.add('insufficient');
          log('Not enough pips!', 'fail');
          return;
        }

        COLORS.forEach(c => { pips[c] -= costs[c]; });
        updateTotals();
        updateActions();

        const name = btn.querySelector('.action-name').textContent;
        const remaining = COLORS.map(c => `${['🔴','🔵','🟢','🟡'][COLORS.indexOf(c)]}${pips[c]}`).join('  ');
        log(`${name} used! Remaining: ${remaining}`, 'ok');
      });
    });

    updateTotals();
    updateActions();
  </script>
</body>
</html>
